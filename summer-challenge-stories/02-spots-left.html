<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WLA · Story 2 — Less Than 50 Spots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0e2746; --navy-deep: #003060; --coral: #d97757; --coral-soft: #e5917a; --coral-salmon: #F79F83; --cream: #F4EEE2; --cream-2: #E9DFD3; --paper: #FDFBF8; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #2a2a2a; font-family: "Alegreya Sans", sans-serif; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .ad { width: 1080px; height: 1920px; background: #F4EEE2; position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.5); display: flex; flex-direction: column; color: var(--navy-deep); }
  @media (max-width: 1140px) { body { padding: 12px; } .ad { transform: scale(calc((100vw - 24px) / 1080)); transform-origin: top center; margin-bottom: calc((100vw - 24px) * (-1920 / 1080) + 24px); } }
  .ad::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(140,110,70,0.045) 1px, transparent 1px); background-size: 7px 7px; pointer-events: none; z-index: 0; }
  .ad > * { position: relative; z-index: 1; }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 80px 70px; text-align: center; gap: 60px; }
  .eyebrow { font-family: "Alegreya Sans", sans-serif; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; font-size: 60px; color: var(--coral); white-space: nowrap; display: inline-flex; align-items: center; gap: 18px; }
  .lt { font-family: 'Libre Baskerville', serif; font-weight: 700; color: var(--navy-deep); font-size: 110px; line-height: 1.0; letter-spacing: -0.02em; margin: 0; }
  .big-num { font-family: 'Libre Baskerville', serif; color: var(--coral); font-style: italic; font-weight: 500; font-size: 360px; line-height: 0.85; margin: 0; letter-spacing: -0.04em; }
  .spots { font-family: 'Libre Baskerville', serif; font-weight: 700; color: var(--navy-deep); font-size: 110px; line-height: 1.0; margin: 0; }
  .close { font-family: 'Libre Baskerville', serif; font-style: italic; font-weight: 700; color: var(--navy-deep); font-size: 92px; line-height: 1.15; margin: 0; }
  .close em { color: var(--coral); font-style: italic; font-weight: 700; }
  .gone { font-family: 'Libre Baskerville', serif; font-size: 78px; line-height: 1.2; color: var(--navy-deep); font-weight: 700; margin: 0; font-style: italic; }
  .gone em { color: var(--coral); font-style: italic; font-weight: 700; }

  .brand-bar { background: var(--navy-deep); color: #fff; text-align: center; padding: 38px 30px; font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 38px; letter-spacing: 0.02em; line-height: 1.2; }
  .brand-bar em { color: var(--coral-salmon); font-style: italic; font-weight: 500; }
</style>
</head>
<body>
<div class="ad">
  <div class="body">
    <div class="eyebrow"><span>🚨</span><span>Filling Fast</span><span>🚨</span></div>
    <p class="lt">Less than</p>
    <p class="big-num">50</p>
    <p class="spots">spots left</p>
    <p class="close">Doors close <em>at midnight</em></p>
    <p class="gone">Once they're gone,<br/><em>they're gone.</em></p>
  </div>
  <div class="brand-bar">The Weight Loss <em>&amp;</em> Lifestyle Academy</div>
</div>
</body>
</html>
