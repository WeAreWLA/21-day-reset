<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WLA · Story 4 — Tap To Join</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0e2746; --navy-deep: #003060; --coral: #d97757; --coral-soft: #e5917a; --coral-salmon: #F79F83; --cream: #F4EEE2; --cream-2: #E9DFD3; --paper: #FDFBF8; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #2a2a2a; font-family: "Alegreya Sans", sans-serif; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .ad { width: 1080px; height: 1920px; background: #F4EEE2; position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.5); display: flex; flex-direction: column; color: var(--navy-deep); }
  @media (max-width: 1140px) { body { padding: 12px; } .ad { transform: scale(calc((100vw - 24px) / 1080)); transform-origin: top center; margin-bottom: calc((100vw - 24px) * (-1920 / 1080) + 24px); } }
  .ad::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(140,110,70,0.045) 1px, transparent 1px); background-size: 7px 7px; pointer-events: none; z-index: 0; }
  .ad > * { position: relative; z-index: 1; }

  .body { flex: 1; display: flex; flex-direction: column; padding: 90px 70px 40px; text-align: center; }
  .eyebrow { font-family: "Alegreya Sans", sans-serif; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; font-size: 60px; color: var(--coral); margin-bottom: 38px; white-space: nowrap; }
  .hero { font-family: 'Libre Baskerville', serif; font-weight: 700; color: var(--navy-deep); font-size: 220px; line-height: 0.95; letter-spacing: -0.025em; margin: 0 0 38px; }
  .hero em { color: var(--coral); font-style: italic; font-weight: 500; }
  .sub-strong { font-family: 'Libre Baskerville', serif; font-style: italic; font-weight: 700; color: var(--coral); font-size: 80px; line-height: 1.2; margin: 0 0 10px; }
  .sub { font-family: 'Libre Baskerville', serif; font-style: italic; color: var(--navy-deep); font-size: 72px; line-height: 1.25; margin: 0; font-weight: 700; }

  .arrow-row { display: flex; flex-direction: column; align-items: center; gap: 22px; margin-top: auto; padding-top: 60px; }
  .tap-label { font-family: "Alegreya Sans", sans-serif; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; font-size: 44px; color: var(--navy-deep); }
  .arrow { color: var(--coral); }
  .arrow svg { width: 240px; height: 280px; display: block; }

  .sticker-zone { align-self: stretch; background: var(--navy-deep); border-radius: 999px; height: 140px; margin: 18px 40px 0; box-shadow: 0 18px 36px -18px rgba(14,39,70,0.4); flex: none; }

  .brand-bar { background: var(--navy-deep); color: #fff; text-align: center; padding: 38px 30px; font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 38px; letter-spacing: 0.02em; line-height: 1.2; }
  .brand-bar em { color: var(--coral-salmon); font-style: italic; font-weight: 500; }
</style>
</head>
<body>
<div class="ad">
  <div class="body">
    <div class="eyebrow">✦ Summer Challenge ✦</div>
    <h1 class="hero">Tap to<br/><em>join us.</em></h1>
    <p class="sub-strong">Less than 50 spots left.</p>
    <p class="sub">Doors close at midnight.</p>

    <div class="arrow-row">
      <div class="tap-label">Tap the link below</div>
      <div class="arrow">
        <svg viewBox="0 0 200 240" aria-hidden="true">
          <path d="M70 0 L130 0 L130 120 L185 120 L100 230 L15 120 L70 120 Z" fill="#d97757"/>
        </svg>
      </div>
      <div class="sticker-zone"></div>
    </div>
  </div>
  <div class="brand-bar">The Weight Loss <em>&amp;</em> Lifestyle Academy</div>
</div>
</body>
</html>
