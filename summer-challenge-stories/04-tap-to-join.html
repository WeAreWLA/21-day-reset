<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WLA · Story 4 — Tap To Join</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0e2746; --navy-deep: #003060; --coral: #d97757; --coral-soft: #e5917a; --coral-salmon: #F79F83; --cream: #F4EEE2; --cream-2: #E9DFD3; --paper: #FDFBF8; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #2a2a2a; font-family: "Alegreya Sans", sans-serif; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .ad { width: 1080px; height: 1920px; background: #F4EEE2; position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.5); display: flex; flex-direction: column; color: var(--navy-deep); }
  @media (max-width: 1140px) { body { padding: 12px; } .ad { transform: scale(calc((100vw - 24px) / 1080)); transform-origin: top center; margin-bottom: calc((100vw - 24px) * (-1920 / 1080) + 24px); } }
  .ad::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(140,110,70,0.045) 1px, transparent 1px); background-size: 7px 7px; pointer-events: none; z-index: 0; }
  .ad > * { position: relative; z-index: 1; }

  .body { flex: 1; display: flex; flex-direction: column; padding: 90px 70px 60px; text-align: center; }
  .eyebrow { font-family: "Alegreya Sans", sans-serif; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; font-size: 30px; color: var(--coral); margin-bottom: 24px; }
  .hero { font-family: 'Libre Baskerville', serif; font-weight: 700; color: var(--navy-deep); font-size: 168px; line-height: 0.95; letter-spacing: -0.02em; margin: 0 0 24px; }
  .hero em { color: var(--coral); font-style: italic; font-weight: 500; }
  .sub { font-family: 'Libre Baskerville', serif; font-style: italic; color: var(--navy-deep); font-size: 50px; line-height: 1.3; margin: 0; }
  .sub strong { font-style: normal; color: var(--coral); font-weight: 700; }
  .center-spacer { flex: 1; min-height: 60px; }

  /* Big arrow pointing down to where the link sticker goes */
  .arrow-row { display: flex; flex-direction: column; align-items: center; gap: 28px; margin-top: auto; }
  .arrow { color: var(--coral); animation: bounce 1.8s ease-in-out infinite; }
  .arrow svg { width: 180px; height: 240px; stroke: var(--coral); fill: none; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(20px); } }
  .tap-label { font-family: "Alegreya Sans", sans-serif; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; font-size: 32px; color: var(--navy-deep); }

  /* Reserved area for IG link sticker — empty space at the bottom */
  .sticker-zone { background: rgba(0,48,96,0.06); border: 3px dashed rgba(0,48,96,0.20); border-radius: 28px; height: 280px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 18px; margin-top: 30px; }
  .sticker-zone .ig-pill { padding: 20px 40px; background: var(--navy-deep); color: #fff; border-radius: 999px; font-family: "Alegreya Sans", sans-serif; font-weight: 800; font-size: 38px; letter-spacing: 0.06em; display: inline-flex; align-items: center; gap: 14px; }
  .sticker-zone .note { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 26px; color: var(--navy-deep); opacity: 0.55; }
</style>
</head>
<body>
<div class="ad">
  <div class="body">
    <div class="eyebrow">✦ Summer Challenge ✦</div>
    <h1 class="hero">Tap to<br/><em>join us.</em></h1>
    <p class="sub"><strong>Less than 50 spots left.</strong><br/>Doors close at midnight.</p>

    <div class="center-spacer"></div>

    <div class="arrow-row">
      <div class="tap-label">Tap the link below</div>
      <div class="arrow"><svg viewBox="0 0 24 32" aria-hidden="true"><line x1="12" y1="2" x2="12" y2="26"/><polyline points="4 18 12 28 20 18"/></svg></div>
      <div class="sticker-zone">
        <span class="ig-pill">🔗 Join Summer Challenge</span>
        <span class="note">place the IG link sticker here</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
