<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WLA · Story 3 — Still A Chance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root { --navy: #0e2746; --navy-deep: #003060; --coral: #d97757; --coral-soft: #e5917a; --coral-salmon: #F79F83; --cream: #F4EEE2; --cream-2: #E9DFD3; --paper: #FDFBF8; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #2a2a2a; font-family: "Alegreya Sans", sans-serif; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .ad { width: 1080px; height: 1920px; background: var(--navy-deep); position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.5); display: flex; flex-direction: column; color: #fff; }
  @media (max-width: 1140px) { body { padding: 12px; } .ad { transform: scale(calc((100vw - 24px) / 1080)); transform-origin: top center; margin-bottom: calc((100vw - 24px) * (-1920 / 1080) + 24px); } }
  .ad::before { content: ''; position: absolute; top: -200px; right: -200px; width: 700px; height: 700px; background: radial-gradient(circle, rgba(247,159,131,0.35), transparent 65%); pointer-events: none; }
  .ad::after { content: ''; position: absolute; bottom: -200px; left: -200px; width: 700px; height: 700px; background: radial-gradient(circle, rgba(217,119,87,0.25), transparent 65%); pointer-events: none; }
  .ad > * { position: relative; z-index: 1; }

  .body { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 90px 70px; text-align: center; gap: 70px; }
  .eyebrow { font-family: "Alegreya Sans", sans-serif; font-weight: 800; letter-spacing: 0.24em; text-transform: uppercase; font-size: 32px; color: var(--coral-salmon); }
  .hero { font-family: 'Libre Baskerville', serif; font-weight: 700; color: #fff; font-size: 156px; line-height: 0.98; letter-spacing: -0.02em; margin: 0; }
  .hero em { color: var(--coral-salmon); font-style: italic; font-weight: 500; }
  .pill-row { display: flex; flex-direction: column; gap: 22px; }
  .checkpill { display: inline-flex; align-items: center; gap: 22px; padding: 26px 44px; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.18); border-radius: 999px; font-family: 'Libre Baskerville', serif; font-size: 44px; color: #fff; font-weight: 500; line-height: 1.2; }
  .checkpill em { color: var(--coral-salmon); font-style: italic; font-weight: 500; }
  .checkpill .tick { width: 50px; height: 50px; border-radius: 50%; background: var(--coral); color: #fff; display: grid; place-items: center; flex: none; font-family: "Alegreya Sans", sans-serif; font-weight: 800; font-size: 28px; }
  .footer-block { background: var(--coral); color: #fff; text-align: center; padding: 40px 30px; font-family: "Alegreya Sans", sans-serif; font-weight: 800; font-size: 36px; letter-spacing: 0.18em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="ad">
  <div class="body">
    <div class="eyebrow">✦ Don't Miss Out ✦</div>
    <h1 class="hero">There's <em>still</em><br/>a chance to <em>join.</em></h1>
    <div class="pill-row">
      <div class="checkpill"><span class="tick">✓</span><span>Last few <em>spots</em></span></div>
      <div class="checkpill"><span class="tick">✓</span><span>Doors close at <em>midnight</em></span></div>
      <div class="checkpill"><span class="tick">✓</span><span><em>£97</em> launch pricing</span></div>
    </div>
  </div>
  <div class="footer-block">Lock In Your Spot Now</div>
</div>
</body>
</html>
