<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>IG Story · Day 1 Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #f9f7f4; font-family: 'Alegreya Sans', sans-serif; color: #003060; overflow: hidden; }
  .stage { position: relative; width: 1080px; height: 1920px; padding: 260px 80px 280px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; }
  .top { display: flex; flex-direction: column; align-items: center; gap: 36px; }
  .eyebrow { font-size: 28px; letter-spacing: 0.36em; text-transform: uppercase; color: #f79f83; font-weight: 700; display: inline-flex; align-items: center; gap: 22px; }
  .eyebrow::before, .eyebrow::after { content: ''; width: 60px; height: 1px; background: #f79f83; }
  .headline { font-family: 'Libre Baskerville', serif; font-size: 76px; line-height: 1.08; font-weight: 400; letter-spacing: -0.005em; }
  .headline em { font-style: italic; color: #f79f83; font-weight: 400; }
  .stat-block { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .stat { font-family: 'Libre Baskerville', serif; font-size: 420px; line-height: 0.85; font-weight: 700; color: #003060; letter-spacing: -0.025em; }
  .stat .plus { font-size: 200px; color: #f79f83; vertical-align: top; line-height: 1; margin-left: 8px; }
  .stat-label { font-family: 'Libre Baskerville', serif; font-size: 48px; line-height: 1.15; font-style: italic; color: #003060; }
  .stat-label strong { font-style: normal; font-weight: 700; }
  .deadline-card { background: #003060; color: #fdf6ef; border-radius: 22px; padding: 36px 44px; max-width: 760px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: 0 30px 60px -30px rgba(0,48,96,0.4); }
  .deadline-label { font-size: 22px; letter-spacing: 0.4em; text-transform: uppercase; color: #fac0ab; font-weight: 700; }
  .deadline-date { font-family: 'Libre Baskerville', serif; font-size: 56px; line-height: 1.1; font-weight: 700; }
  .deadline-date em { font-style: italic; color: #f79f83; font-weight: 400; }
</style></head>
<body>
  <div class="stage">
    <div class="top">
      <div class="eyebrow">Day 1 of Doors Open</div>
      <div class="headline">Look who's <em>already in.</em></div>
      <div class="stat-block">
        <div class="stat">100<span class="plus">+</span></div>
        <div class="stat-label"><strong>women</strong> already registered</div>
      </div>
    </div>
    <div class="deadline-card">
      <div class="deadline-label">Doors close</div>
      <div class="deadline-date"><em>Sunday 24th May</em></div>
    </div>
  </div>
</body></html>
