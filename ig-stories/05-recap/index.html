<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>IG Story · Day 1 Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #f9f7f4; font-family: 'Alegreya Sans', sans-serif; color: #003060; overflow: hidden; }
  .stage { position: relative; width: 1080px; height: 1920px; padding: 180px 70px 200px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 48px; }
  .top { display: flex; flex-direction: column; align-items: center; gap: 32px; }
  .eyebrow { font-size: 34px; letter-spacing: 0.34em; text-transform: uppercase; color: #f79f83; font-weight: 700; display: inline-flex; align-items: center; gap: 24px; }
  .eyebrow::before, .eyebrow::after { content: ''; width: 64px; height: 2px; background: #f79f83; }
  .headline { font-family: 'Libre Baskerville', serif; font-size: 88px; line-height: 1.06; font-weight: 400; letter-spacing: -0.005em; }
  .headline em { font-style: italic; color: #f79f83; font-weight: 400; }
  .stat-block { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .stat { font-family: 'Libre Baskerville', serif; font-size: 360px; line-height: 0.82; font-weight: 700; color: #003060; letter-spacing: -0.02em; }
  .stat-label { font-family: 'Libre Baskerville', serif; font-size: 52px; line-height: 1.2; font-style: italic; color: #003060; }
  .stat-label strong { font-style: normal; font-weight: 700; }
  .program { margin-top: 14px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .program-name { font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 50px; line-height: 1.1; color: #003060; }
  .program-edition { font-family: 'Alegreya Sans', sans-serif; font-size: 30px; letter-spacing: 0.16em; text-transform: uppercase; color: #f79f83; font-weight: 700; }
  .deadline-card { background: #003060; color: #fdf6ef; border-radius: 24px; padding: 38px 56px; max-width: 820px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 30px 60px -30px rgba(0,48,96,0.4); }
  .deadline-label { font-size: 28px; letter-spacing: 0.38em; text-transform: uppercase; color: #fac0ab; font-weight: 700; }
  .deadline-date { font-family: 'Libre Baskerville', serif; font-size: 66px; line-height: 1.1; font-weight: 700; }
  .deadline-date em { font-style: italic; color: #f79f83; font-weight: 400; }
  .cta-group { display: flex; flex-direction: column; align-items: center; gap: 20px; }
  .cta-btn { background: #f79f83; color: #003060; border-radius: 999px; padding: 36px 70px; font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 56px; display: inline-flex; align-items: center; gap: 22px; box-shadow: 0 26px 54px -20px rgba(247,159,131,0.65); }
  .cta-sub { font-family: 'Alegreya Sans', sans-serif; font-size: 32px; letter-spacing: 0.24em; text-transform: uppercase; color: #003060; font-weight: 700; opacity: 0.72; }
</style></head>
<body>
  <div class="stage">
    <div class="top">
      <div class="eyebrow">Day 1 of Doors Open</div>
      <div class="headline">Look who's <em>already in.</em></div>
      <div class="stat-block">
        <div class="stat">447</div>
        <div class="stat-label"><strong>women</strong> already registered for the</div>
        <div class="program">
          <div class="program-name">5 Day Fat Loss Reset</div>
          <div class="program-edition">Women Over 45 Edition</div>
        </div>
      </div>
    </div>
    <div class="deadline-card">
      <div class="deadline-label">Doors close</div>
      <div class="deadline-date"><em>Sunday 24th May</em></div>
    </div>
    <div class="cta-group">
      <div class="cta-btn">Sign up now for free &rarr;</div>
      <div class="cta-sub">Link in bio</div>
    </div>
  </div>
</body></html>
