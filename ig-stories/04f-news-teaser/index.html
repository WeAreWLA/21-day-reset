<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>IG Story · Did you see the news?</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #f9f7f4; font-family: 'Alegreya Sans', sans-serif; color: #003060; overflow: hidden; }
  .stage { position: relative; width: 1080px; height: 1920px; padding: 230px 80px 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 56px; }
  .flourish { opacity: 0.75; }
  .eyebrow { font-size: 32px; letter-spacing: 0.36em; text-transform: uppercase; color: #f79f83; font-weight: 700; }
  .headline { font-family: 'Libre Baskerville', serif; font-size: 132px; line-height: 1.04; font-weight: 700; letter-spacing: -0.01em; color: #003060; }
  .headline em { display: block; font-style: italic; font-weight: 400; color: #f79f83; margin-top: 6px; }
  .sub { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 46px; line-height: 1.4; color: #003060; opacity: 0.82; max-width: 760px; }
  .keep-watching { display: inline-flex; flex-direction: column; align-items: center; gap: 14px; font-family: 'Alegreya Sans', sans-serif; font-size: 30px; letter-spacing: 0.24em; text-transform: uppercase; color: #003060; font-weight: 700; opacity: 0.7; }
  .keep-watching .arrow { font-size: 56px; line-height: 1; color: #f79f83; }
</style></head>
<body>
  <div class="stage">
    <svg class="flourish" width="240" height="40" viewBox="0 0 200 38" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 19 L 88 19" stroke="#003060" stroke-width="0.8" stroke-linecap="round"/>
      <path d="M112 19 L 190 19" stroke="#003060" stroke-width="0.8" stroke-linecap="round"/>
      <circle cx="100" cy="19" r="3.5" fill="#003060"/>
      <circle cx="100" cy="19" r="6" stroke="#003060" stroke-width="0.6" fill="none"/>
      <path d="M70 19 Q 78 12, 86 19" stroke="#003060" stroke-width="0.6" fill="none"/>
      <path d="M114 19 Q 122 26, 130 19" stroke="#003060" stroke-width="0.6" fill="none"/>
      <circle cx="40" cy="19" r="1.2" fill="#003060"/>
      <circle cx="160" cy="19" r="1.2" fill="#003060"/>
    </svg>

    <div class="eyebrow">Psst... quick one</div>

    <h1 class="headline">Did you see<em>the news?</em></h1>

    <div class="sub">Something brand new just opened for women over 45 and it's free.</div>

    <div class="keep-watching">
      Keep watching
      <span class="arrow">&darr;</span>
    </div>
  </div>
</body></html>
