<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>IG Story · It's Open</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #003060; font-family: 'Alegreya Sans', sans-serif; color: #fdf6ef; overflow: hidden; }
  .stage { position: relative; width: 1080px; height: 1920px; padding: 280px 80px 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 60px; }
  .glow { position: absolute; top: 50%; left: 50%; width: 1200px; height: 1200px; transform: translate(-50%, -50%); background: radial-gradient(circle, rgba(247,159,131,0.22), transparent 60%); pointer-events: none; }
  .eyebrow { font-size: 30px; letter-spacing: 0.42em; text-transform: uppercase; color: #f79f83; font-weight: 700; position: relative; z-index: 2; }
  .it-is { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 96px; line-height: 1; color: #fdf6ef; opacity: 0.92; font-weight: 400; letter-spacing: -0.005em; position: relative; z-index: 2; }
  .open { font-family: 'Libre Baskerville', serif; font-size: 360px; line-height: 0.86; letter-spacing: -0.02em; font-weight: 700; color: #f79f83; position: relative; z-index: 2; }
  .sub { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 44px; color: #fdf6ef; opacity: 0.85; max-width: 800px; line-height: 1.35; position: relative; z-index: 2; }
  .dates { font-size: 26px; letter-spacing: 0.4em; text-transform: uppercase; color: #fac0ab; font-weight: 600; position: relative; z-index: 2; }
</style></head>
<body>
  <div class="stage">
    <div class="glow"></div>
    <div class="eyebrow">The 5 Day Fat Loss Reset</div>
    <div class="it-is">it's</div>
    <div class="open">OPEN</div>
    <div class="sub">Doors are open. Spaces are limited.</div>
    <div class="dates">Live · 1st — 5th June</div>
  </div>
</body></html>
