<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>IG Story · Link Sticker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #f9f7f4; font-family: 'Alegreya Sans', sans-serif; color: #003060; overflow: hidden; }
  .stage { position: relative; width: 1080px; height: 1920px; padding: 280px 80px 280px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 50px; }
  .pill { display: inline-flex; align-items: center; gap: 16px; background: rgba(46,125,91,0.12); color: #2e7d5b; font-size: 26px; letter-spacing: 0.32em; text-transform: uppercase; font-weight: 700; padding: 14px 28px; border-radius: 999px; }
  .pill .dot { width: 10px; height: 10px; background: #2e7d5b; border-radius: 50%; box-shadow: 0 0 0 0 rgba(46,125,91,0.5); }
  .headline { font-family: 'Libre Baskerville', serif; font-size: 110px; line-height: 1.04; letter-spacing: -0.01em; font-weight: 400; }
  .headline em { font-style: italic; color: #f79f83; font-weight: 400; }
  .arrow { font-size: 240px; line-height: 1; color: #f79f83; font-weight: 700; margin-top: 30px; }
  .arrow .stem { display: inline-block; }
  .sub { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 38px; opacity: 0.75; max-width: 700px; line-height: 1.35; }
  .micro { margin-top: 60px; font-size: 22px; letter-spacing: 0.34em; text-transform: uppercase; font-weight: 600; opacity: 0.55; }
</style></head>
<body>
  <div class="stage">
    <div class="pill"><span class="dot"></span>Free this round</div>
    <div class="headline">Tap here to<br /><em>register free.</em></div>
    <div class="arrow">↓</div>
    <div class="sub">Tap the link sticker below — you're in, in 30 seconds.</div>
  </div>
</body></html>
