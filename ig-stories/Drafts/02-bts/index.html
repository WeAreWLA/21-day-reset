<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>IG Story · Working on Something</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #1a1a1c; font-family: 'Alegreya Sans', sans-serif; color: #fff; overflow: hidden; }
  .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .photo { position: absolute; inset: 0; background-image: url('../../assets/anna-portrait.jpg'); background-size: cover; background-position: center 30%; filter: contrast(1.02) saturate(0.95); }
  .overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,48,96,0.0) 0%, rgba(0,48,96,0.0) 45%, rgba(0,48,96,0.55) 75%, rgba(0,48,96,0.85) 100%); }
  .content { position: absolute; left: 0; right: 0; bottom: 280px; padding: 0 90px; text-align: center; }
  .eyebrow { font-size: 26px; letter-spacing: 0.36em; text-transform: uppercase; color: #f79f83; font-weight: 700; margin-bottom: 36px; }
  .headline { font-family: 'Libre Baskerville', serif; font-size: 92px; line-height: 1.08; color: #fdf6ef; font-weight: 400; letter-spacing: -0.005em; }
  .headline em { font-style: italic; color: #f79f83; font-weight: 400; }
  .sub { margin-top: 32px; font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 44px; color: #fdf6ef; opacity: 0.92; letter-spacing: 0.005em; }
</style></head>
<body>
  <div class="stage">
    <div class="photo"></div>
    <div class="overlay"></div>
    <div class="content">
      <div class="eyebrow">Behind the scenes</div>
      <div class="headline">Working on <em>something</em> for you 👀</div>
      <div class="sub">More tomorrow.</div>
    </div>
  </div>
</body></html>
