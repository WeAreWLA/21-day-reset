<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>IG Story · 2 Days Left to Register</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #f9f7f4; font-family: 'Alegreya Sans', sans-serif; color: #003060; overflow: hidden; }
  .stage { position: relative; width: 1080px; height: 1920px; padding: 200px 70px 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 56px; }

  .eyebrow { font-size: 34px; letter-spacing: 0.34em; text-transform: uppercase; color: #f79f83; font-weight: 700; display: inline-flex; align-items: center; gap: 24px; }
  .eyebrow::before, .eyebrow::after { content: ''; width: 64px; height: 2px; background: #f79f83; }

  .stat-block { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-top: 12px; }
  .stat { font-family: 'Libre Baskerville', serif; font-size: 560px; line-height: 0.82; font-weight: 700; color: #f79f83; letter-spacing: -0.03em; }
  .stat-label { font-family: 'Libre Baskerville', serif; font-size: 52px; line-height: 1.2; font-style: italic; color: #003060; }
  .stat-label strong { font-style: normal; font-weight: 700; }

  .programme { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .programme-name { font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 50px; line-height: 1.1; color: #003060; }
  .programme-edition { font-family: 'Alegreya Sans', sans-serif; font-size: 30px; letter-spacing: 0.16em; text-transform: uppercase; color: #f79f83; font-weight: 700; }

  .start-card { background: #003060; color: #fdf6ef; border-radius: 24px; padding: 38px 64px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: 0 30px 60px -30px rgba(0,48,96,0.4); }
  .start-label { font-size: 28px; letter-spacing: 0.38em; text-transform: uppercase; color: #fac0ab; font-weight: 700; }
  .start-date { font-family: 'Libre Baskerville', serif; font-size: 66px; line-height: 1.1; font-weight: 700; }
  .start-date em { font-style: italic; color: #f79f83; font-weight: 400; }
</style></head>
<body>
  <div class="stage">
    <div class="eyebrow">Doors Close Sunday</div>

    <div class="stat-block">
      <div class="stat">2</div>
      <div class="stat-label"><strong>days</strong> left to register for the</div>
      <div class="programme">
        <div class="programme-name">Free 5 Day Fat Loss Reset</div>
        <div class="programme-edition">Women Over 45 Edition</div>
      </div>
    </div>

    <div class="start-card">
      <div class="start-label">Doors close</div>
      <div class="start-date"><em>Sunday</em> 31st May</div>
    </div>
  </div>
</body></html>
