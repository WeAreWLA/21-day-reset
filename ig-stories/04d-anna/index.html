<!doctype html>
<html lang="en"><head><meta charset="utf-8" />
<title>IG Story · Anna Invite</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:wght@400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 1920px; background: #1a1a1c; font-family: 'Alegreya Sans', sans-serif; color: #fff; overflow: hidden; }
  .stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; }
  .photo { position: absolute; inset: 0; background-image: url('../../assets/anna-portrait.jpg'); background-size: cover; background-position: center 25%; }
  .overlay { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,48,96,0.0) 0%, rgba(0,48,96,0.0) 35%, rgba(0,48,96,0.55) 65%, rgba(0,48,96,0.90) 100%); }
  .content { position: absolute; left: 0; right: 0; bottom: 260px; padding: 0 90px; text-align: center; }
  .eyebrow { font-size: 26px; letter-spacing: 0.36em; text-transform: uppercase; color: #f79f83; font-weight: 700; margin-bottom: 36px; }
  .headline { font-family: 'Caveat', cursive; font-size: 130px; line-height: 1.0; color: #fdf6ef; font-weight: 500; letter-spacing: -0.005em; }
  .headline em { color: #f79f83; font-style: italic; }
  .signature { margin-top: 36px; font-family: 'Caveat', cursive; font-style: italic; font-size: 60px; color: #f79f83; font-weight: 700; }
  .role { margin-top: 8px; font-size: 22px; letter-spacing: 0.34em; text-transform: uppercase; color: #fdf6ef; opacity: 0.75; font-weight: 600; }
</style></head>
<body>
  <div class="stage">
    <div class="photo"></div>
    <div class="overlay"></div>
    <div class="content">
      <div class="eyebrow">From Anna</div>
      <div class="headline">I'd love to see you<br /><em>in there.</em></div>
      <div class="signature">— Anna</div>
      <div class="role">Founder · WLA</div>
    </div>
  </div>
</body></html>
