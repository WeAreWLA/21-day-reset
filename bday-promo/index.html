<style>
  :root {
    /* WLA brand palette */
    --bg: #F9F7F4;              /* Cream White */
    --cream-deep: #E9DFD3;      /* Warm Beige */
    --paper: #FDFBF8;           /* Near-white paper */
    --ink: #003060;             /* Deep Navy */
    --ink-muted: #5B6B82;       /* Navy-grey for supporting text */
    --body-ink: #333333;        /* Grey Black for paragraphs */
    --terracotta: #F79F83;      /* Soft Blush (accent) */
    --blush-deep: #E87F63;      /* Stronger blush for CTA contrast */
    --sage: #003060;            /* sage replaced by navy for ticks */
    --peach: #F5D9CE;           /* Lighter blush tint */
    --hairline: #D9CFC3;        /* Beige hairline */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--body-ink); font-family: "Alegreya Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  ::selection { background: var(--peach); }
  /* Announcement bar: animated gradient + pulsing dot */
  @keyframes banner-shimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes dot-pulse {
    0%, 100% { transform: scale(1);    box-shadow: 0 0 0 0   rgba(245, 217, 206, 0.7); }
    50%      { transform: scale(1.25); box-shadow: 0 0 0 8px rgba(245, 217, 206, 0); }
  }
  .announcement-bar {
    background: linear-gradient(90deg, #003060 0%, #0A3B6E 25%, #E87F63 50%, #0A3B6E 75%, #003060 100%) !important;
    background-size: 260% 100% !important;
    animation: banner-shimmer 14s ease-in-out infinite;
    padding: 12px 24px !important;
    font-family: "Libre Baskerville", serif !important;
    font-size: 14px !important;
    font-weight: 400;
    letter-spacing: 0.02em !important;
  }
  .announcement-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--peach);
    animation: dot-pulse 1.8s ease-out infinite;
  }
  /* Early-bird banner: desktop uses standalone emoji, mobile inlines it */
  .early-bird-icon-inline { display: none; }
  /* Mobile-only helpers */
  .mobile-break { display: none; }
  @media (max-width: 640px) {
    .early-bird-icon { display: none !important; }
    .early-bird-icon-inline { display: inline !important; }
    .early-bird-plan { display: block; margin-top: 4px; }
    .mobile-break { display: inline; }
    .mobile-no-italic { font-style: normal !important; }
    .problem-thoughts-grid { margin-bottom: 24px !important; }
    .problem-paragraphs { padding-top: 28px !important; }
    /* Tighter vertical rhythm on mobile only */
    .hero-section { padding-top: 40px !important; }
    .early-bird-banner-section { padding-top: 16px !important; padding-bottom: 12px !important; }
    .whatchanges-section { padding-top: 40px !important; }
    .whythisworks-section { padding-bottom: 20px !important; }
    section#method { padding-top: 40px !important; padding-bottom: 32px !important; }
    .whathappens-section { padding-top: 32px !important; padding-bottom: 24px !important; }
    .included-section { padding-top: 32px !important; padding-bottom: 20px !important; }
    .results-grid-section { padding: 40px 14px 44px !important; }
    .spots-section { padding: 34px 16px 4px !important; }
    /* Above the fold on a phone: badge, headline, results, CTA — then detail.
       Every child needs an explicit order, or an ordered one jumps the lot. */
    .hero-left .hero-badge       { order: 1 !important; }
    .hero-left .hero-title       { order: 2 !important; }
    .hero-left .programme-results{ order: 3 !important; }
    .hero-left .hero-cta-block   { order: 4 !important; margin-bottom: 26px !important; }
    .hero-left .hero-key-facts   { order: 5 !important; }
    .hero-left .hero-stats       { order: 6 !important; }
    .hero-title { margin-bottom: 18px !important; }
    /* Card headings are h2s, so the blanket h1/h2 clamp above blows them up.
       Keep them clearly below the section heading. */
    .card-title { font-size: 19px !important; line-height: 1.3 !important; }
    /* 5 tiles over 2 columns leaves one alone on the last row: centre it. */
    section .members-area-block .members-recipe-grid .recipe-tile-last {
      grid-column: 1 / -1;
      width: 50%;
      justify-self: center;
    }
    /* Must out-specify the blanket 1-column collapse for grids. */
    section div.pricing-trust-row { grid-template-columns: repeat(3, 1fr) !important; gap: 6px !important; }
    .callout-title { font-size: 21px !important; line-height: 1.3 !important; }
    .programme-results { margin-bottom: 24px !important; }
    .exit-intent-backdrop { display: none !important; }
    .announcement-bar { padding: 8px 10px !important; gap: 8px !important; }
    .bonus-card { padding: 40px 18px 30px !important; }
    section.countdown-section .countdown-heading { font-size: 30px !important; }
    section.countdown-section .countdown-facts { padding: 0 !important; }
    .programme-results > div > div { font-size: 20px !important; }
    .transform-section { padding-bottom: 24px !important; }
    .pricing-bridge { padding-top: 32px !important; }
    .video-testimonials-section { padding-bottom: 24px !important; }
    section#faq.faq-section { padding-top: 32px !important; }
    section.countdown-section { padding: 40px 14px !important; }
    section.countdown-section .countdown-grid { grid-template-columns: repeat(4, 1fr) !important; gap: 6px !important; }
    section.countdown-section .countdown-box { padding: 14px 4px !important; border-radius: 10px !important; }
    section.countdown-section .countdown-num { font-size: 28px !important; }
    section.countdown-section .countdown-lab { font-size: 9px !important; letter-spacing: 0.1em !important; margin-top: 6px !important; }
  }
  /* Tweaks panel */
  .tweaks-panel { position: fixed; bottom: 20px; right: 20px; background: var(--paper); border: 1px solid var(--hairline); border-radius: 14px; padding: 18px; font-family: "Alegreya Sans", sans-serif; font-size: 14px; width: 260px; box-shadow: 0 20px 40px -20px rgba(0,48,96,.2); z-index: 200; }
  .tweaks-panel h4 { margin: 0 0 12px; font-family: "Libre Baskerville", serif; font-size: 17px; font-weight: 700; color: var(--ink); }
  .tweaks-panel label { display: block; margin-bottom: 10px; color: var(--ink-muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .tweaks-panel input[type=color] { width: 100%; height: 32px; border: 1px solid var(--hairline); border-radius: 6px; padding: 2px; background: white; cursor: pointer; }
  .tweaks-panel select, .tweaks-panel input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--hairline); border-radius: 6px; font-family: inherit; font-size: 13px; background: white; }

  /* ---------- Responsive ---------- */
  /* Tablet and below */
  @media (max-width: 960px) {
    /* Collapse all multi-col grids to single column, any depth */
    section [style*="grid-template-columns"],
    section[style*="grid-template-columns"] {
      grid-template-columns: 1fr !important;
      gap: 32px !important;
    }
    /* Reduce outer section padding */
    section { padding-left: 20px !important; padding-right: 20px !important; }
    /* Shrink huge display text */
    h1, h2 { font-size: clamp(34px, 7vw, 56px) !important; line-height: 1.15 !important; }
    /* Hide entire nav (logo + CTA) on mobile */
    nav { display: none !important; }
    /* Announcement bar smaller */
    body > div:first-child { font-size: 12px !important; padding: 8px 16px !important; }
    /* Hero image block: reset absolute floating chips so they don't overflow viewport */
    section > div > div[style*="position: relative"] > div[style*="position: absolute"] {
      position: relative !important;
      inset: auto !important;
      top: auto !important; left: auto !important; right: auto !important; bottom: auto !important;
      transform: none !important;
      margin-top: 16px !important;
      max-width: 100% !important;
    }
    /* Pull the Ruth quote chip up to the corner so it doesn't cover Anna's face */
    section > div[style*="position: relative"] > div[style*="rotate(-2deg)"] {
      top: -22px !important;
      left: -10px !important;
      right: auto !important;
      bottom: auto !important;
      max-width: 200px !important;
    }
    /* Big numbers in SHIFT method: shrink */
    section#method div[style*="font-size: 92"] { font-size: 56px !important; }
    /* Stat pills wrap */
    section > div > div[style*="border-top"][style*="gap: 48"] { flex-wrap: wrap !important; gap: 24px !important; }
    /* Pricing card padding — keep top spacious so Early Bird pill floats clear of £7 */
    section[id^="join"] > div > div[style*="border-radius: 24"] { padding: 72px 20px 32px !important; }
    /* Early Bird pill: thicker + higher on mobile so it sits well above the £7 */
    section[id^="join"] > div > div[style*="border-radius: 24"] > div[style*="top: -14"] {
      top: -26px !important;
      padding: 10px 24px !important;
      font-size: 12px !important;
    }
    section[id^="join"] div[style*="font-size: 100"] { font-size: 72px !important; }
    /* FAQ sticky column becomes static */
    section#faq div[style*="position: sticky"] { position: static !important; }
    /* Sticky CTA full width text sizing */
    /* Before/after grid: 2-col on tablet */
    section section, section {}
    /* Override to 2 columns for before/after photo grid on tablet via wider rule */
  }
  @media (max-width: 960px) and (min-width: 641px) {
    /* Keep photo grid 2-col on tablet */
    section [style*="grid-template-columns: repeat(4"] {
      grid-template-columns: repeat(2, 1fr) !important;
    }
  }
  /* Results wall and recipe showcase keep multiple columns on small screens —
     the blanket 1-col collapse above would make them absurdly tall. These
     selectors are deliberately more specific than that blanket rule. */
  @media (max-width: 960px) {
    section.results-grid-section div[style*="grid-template-columns"] {
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 10px !important;
    }
    section .members-area-block .members-recipe-grid {
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 10px !important;
    }
    section .members-area-block .members-perks,
    section .masterclasses-block .masterclass-grid {
      grid-template-columns: 1fr !important;
      gap: 12px !important;
    }
    section.countdown-section .countdown-facts {
      grid-template-columns: repeat(3, 1fr) !important;
      gap: 8px !important;
    }
    .hero-key-facts { max-width: 100% !important; }
  }
  @media (max-width: 640px) {
    section.results-grid-section div[style*="grid-template-columns"] {
      grid-template-columns: repeat(2, 1fr) !important;
    }
    section .members-area-block .members-recipe-grid {
      grid-template-columns: repeat(2, 1fr) !important;
    }
  }
  @media (max-width: 640px) {
    /* Collapse 4-col grids etc already handled. Further shrinks. */
    section { padding-top: 72px !important; padding-bottom: 72px !important; }
    h1, h2 { font-size: clamp(30px, 8vw, 44px) !important; }
    /* Smaller testimonial / included cards padding */
    section > div > div[style*="border-radius"][style*="padding: 32"] { padding: 22px !important; }
    /* Tweaks panel shrinks */
    .tweaks-panel { width: calc(100vw - 40px) !important; right: 20px !important; }
    /* Sticky CTA: compact layout so button doesn't overflow on narrow Androids */
    .sticky-cta { padding: 6px 6px 6px 16px !important; gap: 10px !important; }
    .sticky-cta-text { font-size: 12px !important; }
    .sticky-cta-secondary { display: none !important; }
    .sticky-cta-button { padding: 10px 14px !important; font-size: 13px !important; }
  }
  @media (max-width: 420px) {
    /* Even tighter for small phones */
    .sticky-cta { padding: 5px 5px 5px 12px !important; gap: 8px !important; }
    .sticky-cta-text { font-size: 11px !important; }
    .sticky-cta-button { padding: 9px 12px !important; font-size: 12px !important; }
    /* Narrow phones (mostly Android) — shift the hero image crop to the left
       so Anna lands on the right of the frame (matches iPhone rendering) */
    .hero-img { object-position: 25% center !important; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="/bday-promo/components/sections.jsx"></script>
<script type="text/babel" src="/bday-promo/components/hero.jsx"></script>
<script type="text/babel" src="/bday-promo/components/method.jsx"></script>
<script type="text/babel" src="/bday-promo/components/content.jsx"></script>
<script type="text/babel" src="/bday-promo/components/closing.jsx"></script>

<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "headlineVariant": "birthday",
  "showStickyCTA": true,
  "ctaStyle": "navy"
} /*EDITMODE-END*/;

const HEADLINES = {
  "birthday": {
    eyebrow: "Anna's Birthday Promo",
    title: <>The 21 Day<br /><Italic>Fat Loss Reset</Italic></>,
  },
  "gift-to-you": {
    eyebrow: "Anna's Birthday Promo",
    title: <>My birthday.<br /><Italic>Your gift.</Italic><br />21{'\u00a0'}days for <Italic>£7</Italic>.</>,
  },
  "nothing-works": {
    eyebrow: "Anna's Birthday Promo",
    title: <>The 21 Day Fat Loss Reset<br /><Italic>lose weight</Italic><br /><Italic>curb cravings</Italic><br /><Italic>boost energy</Italic></>,
  }
};

// What the programme delivers — the headline promise, broken out so it lands.
const PROGRAMME_RESULTS = [
  <>Lose up to <strong>1 stone</strong></>,
  <>Curb your <strong>cravings</strong></>,
  <>Increase your <strong>energy &amp; confidence</strong></>,
];

// The three key facts under the hero headline.
const HERO_KEY_FACTS = [
  { icon: '🎂', label: <>Discounted to <strong>£7</strong> <span style={{ color: 'var(--ink-muted)' }}>(normally £97)</span> for <strong>{window.OFFER_HOURS} hours only</strong></>, note: 'The price increases when the timer runs out' },
  { icon: '📅', label: <>Kick-off on <strong>Monday 7th September</strong></>, note: null },
  { icon: '🎟️', label: <>Only <strong>{window.SPOTS_LEFT} spots left</strong> of {window.SPOTS_AVAILABLE}</>, note: 'Once they’re gone, they’re gone' },
];

function App() {
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const [stickyVisible, setStickyVisible] = React.useState(false);
  const [phase, setPhase] = React.useState(() => (window.getCampaignPhase ? window.getCampaignPhase() : 'open'));

  // Re-check the campaign phase every minute so the page flips from the
  // birthday promo to the started state when the timer runs out, without a refresh.
  React.useEffect(() => {
    if (!window.getCampaignPhase) return;
    const id = setInterval(() => {
      const p = window.getCampaignPhase();
      setPhase((prev) => (prev !== p ? p : prev));
    }, 60000);
    return () => clearInterval(id);
  }, []);

  // Apply CTA style
  React.useEffect(() => {
    if (tweaks.ctaStyle === 'blush') {
      document.documentElement.style.setProperty('--cta-bg', '#E87F63');
    } else {
      document.documentElement.style.setProperty('--cta-bg', '#003060');
    }
  }, [tweaks.ctaStyle]);

  // Sticky CTA visibility
  React.useEffect(() => {
    const onScroll = () => {
      setStickyVisible(window.scrollY > 800 && window.scrollY < document.body.scrollHeight - 1400);
    };
    window.addEventListener('scroll', onScroll);
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  // Edit mode handshake
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const updateTweak = (key, value) => {
    const next = { ...tweaks, [key]: value };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: value } }, '*');
  };

  // Override Hero per tweak
  const headline = HEADLINES[tweaks.headlineVariant] || HEADLINES['nothing-works'];

  return (
    <>
      <AnnouncementBar />
      {/* Tweakable hero wrapper */}
      <TweakableHero headline={headline} phase={phase} />
      <ResultsGridSection />
      <CountdownSection />
      {phase === 'open' && <SpotsRemainingSection />}
      <WhatChangesIn21DaysSection />
      <ProblemSection />
      <HonestTruthSection />
      <WhyThisResetWorksSection />
      <MethodSection />
      <WhatHappensSection />
      <IncludedSection />
      <PricingSection sectionId="join-early" phase={phase} />
      <TestimonialsSection />
      <AboutSection />
      <TransformSection />
      <PricingSection showHeading={false} phase={phase} bridgeHeading={
        <SerifH size={40} style={{ lineHeight: 1.3 }}>
          {phase === 'open'
            ? <>Join now to lock in the <Italic>£7 birthday promo</Italic></>
            : <>Join the <Italic>21 Day Fat Loss Reset</Italic> for £7</>}
        </SerifH>
      } />
      <VideoTestimonialsSection />
      <FAQSection />
      <FinalCTA />
      <Footer />
      {tweaks.showStickyCTA && <StickyCTA visible={stickyVisible} />}
      <ExitIntentModal />

      {tweaksOpen &&
      <div className="tweaks-panel">
          <h4>Tweaks</h4>
          <label>CTA button colour</label>
          <select value={tweaks.ctaStyle}
        onChange={(e) => updateTweak('ctaStyle', e.target.value)}
        style={{ marginBottom: 14 }}>
            <option value="navy">Deep Navy (primary)</option>
            <option value="blush">Soft Blush</option>
          </select>
          <label>Hero headline variant</label>
          <select value={tweaks.headlineVariant}
        onChange={(e) => updateTweak('headlineVariant', e.target.value)}
        style={{ marginBottom: 14 }}>
            <option value="birthday">"It's my birthday, the whole Reset for £7"</option>
            <option value="gift-to-you">"My birthday. Your gift."</option>
            <option value="nothing-works">"Lose weight, curb cravings, boost energy"</option>
          </select>
          <label style={{ display: 'flex', alignItems: 'center', gap: 8, textTransform: 'none', letterSpacing: 0, fontSize: 13, color: 'var(--ink)' }}>
            <input type="checkbox" checked={tweaks.showStickyCTA}
          onChange={(e) => updateTweak('showStickyCTA', e.target.checked)} />
            Sticky price bar
          </label>
        </div>
      }
    </>);

}

function TweakableHero({ headline, phase = 'open' }) {
  return (
    <>
    <section className="hero-section" style={{
      maxWidth: 1240,
      margin: '0 auto',
      padding: '40px 32px 80px',
      display: 'grid',
      gridTemplateColumns: '1.1fr 0.9fr',
      gap: 72,
      alignItems: 'center'
    }}>
      <div className="hero-left" style={{ display: 'flex', flexDirection: 'column' }}>
        <div className="hero-badge" style={{
          display: 'inline-flex', alignItems: 'center', gap: 10,
          alignSelf: 'flex-start',
          background: 'var(--peach)',
          border: '1px solid var(--blush-deep)',
          borderRadius: 999,
          padding: '10px 22px',
          marginBottom: 20,
        }}>
          <span style={{ fontSize: 24, lineHeight: 1 }}>🎂</span>
          <span style={{
            fontFamily: '"Libre Baskerville", serif',
            fontWeight: 700,
            fontSize: 22,
            letterSpacing: '0.01em',
            color: 'var(--ink)',
            lineHeight: 1.2,
          }}>{headline.eyebrow}</span>
        </div>
        <SerifH as="h1" className="hero-title" size={76} style={{ marginTop: 0, marginBottom: 24 }}>
          {headline.title}
        </SerifH>
        <div className="programme-results" style={{
          display: 'flex', flexDirection: 'column', gap: 12,
          maxWidth: 560, marginBottom: 32,
        }}>
          {PROGRAMME_RESULTS.map((r, i) => (
            <div key={i} style={{ display: 'flex', gap: 14, alignItems: 'flex-start' }}>
              <span style={{ flexShrink: 0, marginTop: 6 }}><Tick color="var(--blush-deep)" /></span>
              <div style={{
                fontFamily: '"Alegreya Sans", sans-serif',
                fontSize: 24,
                lineHeight: 1.3,
                color: 'var(--ink)',
              }}>{r}</div>
            </div>
          ))}
        </div>

        {/* Key facts — price window, start date, spots */}
        <div className="hero-key-facts" style={{

      <div style={{ position: 'relative' }}>

}
