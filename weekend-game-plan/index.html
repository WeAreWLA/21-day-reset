<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WLA · Weekend Fat Loss Game Plan (1080×1080)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0e2746; --navy-deep: #003060;
    --coral: #d97757; --coral-soft: #e5917a; --coral-salmon: #F79F83;
    --cream: #F4EEE2; --cream-2: #E9DFD3; --paper: #FDFBF8;
    --muted: #5a6478;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #2a2a2a; font-family: "Alegreya Sans", sans-serif; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }

  .ad {
    width: 1080px; height: 1080px;
    background: #F4EEE2;
    position: relative; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    color: var(--navy-deep);
    display: flex; flex-direction: column;
  }
  @media (max-width: 1140px) {
    body { padding: 12px; }
    .ad { transform: scale(calc((100vw - 24px) / 1080)); transform-origin: top center; margin-bottom: calc((100vw - 24px) * (-1080 / 1080) + 24px); }
  }

  /* Paper texture overlay */
  .ad::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(140,110,70,0.045) 1px, transparent 1px);
    background-size: 7px 7px;
    pointer-events: none;
    z-index: 0;
  }
  .ad > * { position: relative; z-index: 1; }

  /* Top coral accent */
  .top-strip {
    height: 14px;
    background: linear-gradient(90deg, var(--coral) 0%, var(--coral-salmon) 50%, var(--coral) 100%);
  }

  /* Body */
  .body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 80px 90px;
    text-align: center;
    gap: 36px;
  }

  /* Eyebrow */
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 18px;
    color: var(--coral);
    font-family: "Alegreya Sans", sans-serif;
    font-weight: 800;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    font-size: 24px;
  }
  .eyebrow::before, .eyebrow::after {
    content: '';
    width: 70px;
    height: 2px;
    background: var(--coral);
    display: inline-block;
  }

  /* Title */
  .title {
    font-family: 'Libre Baskerville', serif;
    font-weight: 700;
    color: var(--navy-deep);
    font-size: 168px;
    line-height: 1.0;
    letter-spacing: -0.02em;
    margin: 0;
  }
  .title em {
    color: var(--coral);
    font-style: italic;
    font-weight: 500;
  }
  .title .top-word {
    display: block;
    font-style: italic;
    font-weight: 500;
    font-size: 114px;
    color: var(--navy-deep);
    margin-bottom: 18px;
    letter-spacing: 0.01em;
  }

  /* Sub note */
  .sub {
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    font-size: 32px;
    color: var(--coral);
    margin: 0;
    display: inline-flex;
    align-items: center;
    gap: 18px;
  }
  .sub svg { width: 28px; height: 28px; stroke: var(--coral); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sub .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--coral); display: inline-block; }

  /* Bottom bar */
  .bottom-bar {
    background: var(--navy-deep);
    color: #fff;
    text-align: center;
    padding: 28px 20px;
    font-family: "Alegreya Sans", sans-serif;
    font-weight: 800;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    font-size: 24px;
  }
  .bottom-bar .light { font-weight: 400; }
</style>
</head>
<body>

<div class="ad">

  <div class="top-strip"></div>

  <div class="body">

    <h1 class="title">
      <span class="top-word">Weekend</span>
      <em>Fat Loss</em><br/>Game Plan
    </h1>

  </div>

  <div class="bottom-bar"><span class="light">Weight Loss &amp;</span> Lifestyle <span class="light">Academy</span></div>

</div>

</body>
</html>
