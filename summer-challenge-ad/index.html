<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WLA Summer Challenge · Last Chance Ad (1080×1350)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0e2746; --navy-deep: #003060; --navy-darker: #091a30;
    --coral: #d97757; --coral-soft: #e5917a; --coral-salmon: #F79F83;
    --cream: #F4EEE2; --cream-2: #E9DFD3; --paper: #FDFBF8;
    --muted: #5a6478;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #2a2a2a; font-family: "Alegreya Sans", sans-serif; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .serif { font-family: 'Libre Baskerville', serif; }

  /* 1080x1080 canvas (1:1 — safe across all FB + IG placements) */
  .ad {
    width: 1080px; height: 1080px;
    background: #F4EEE2;
    position: relative; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    color: var(--navy-deep);
    display: flex; flex-direction: column;
  }
  @media (max-width: 1140px) {
    body { padding: 12px; }
    .ad { transform: scale(calc((100vw - 24px) / 1080)); transform-origin: top center; margin-bottom: calc((100vw - 24px) * (-1080 / 1080) + 24px); }
  }

  /* TOP URGENCY BANNER */
  .urgency-banner {
    position: relative;
    background: var(--coral-salmon);
    color: var(--navy-deep);
    text-align: center;
    padding: 32px 40px 34px;
    overflow: hidden;
    box-shadow: inset 0 -2px 0 rgba(14,39,70,0.10);
  }
  .urgency-banner::before {
    content: '';
    position: absolute;
    top: 0; left: -40%;
    width: 40%; height: 100%;
    background: linear-gradient(110deg, transparent 0%, rgba(255,255,255,0.5) 50%, transparent 100%);
    transform: skewX(-18deg);
    animation: sheen 3.6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes sheen { 0% { left: -40%; } 60% { left: 120%; } 100% { left: 120%; } }
  .urgency-banner .lab {
    display: inline-block;
    font-family: "Alegreya Sans", sans-serif;
    font-weight: 800;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    font-size: 24px;
    color: rgba(0,48,96,0.85);
    margin-bottom: 8px;
    position: relative; z-index: 1;
  }
  .urgency-banner h1 {
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    font-weight: 700;
    color: var(--navy-deep);
    font-size: 76px;
    line-height: 1.05;
    letter-spacing: -0.005em;
    margin: 0;
    position: relative; z-index: 1;
  }
  .urgency-banner h1 .price {
    font-style: normal;
    background: var(--navy-deep);
    color: #fff;
    padding: 0 24px;
    border-radius: 16px;
    margin-left: 6px;
    display: inline-block;
    line-height: 1.1;
  }

  /* BODY */
  .body {
    flex: 1;
    text-align: center;
    padding: 64px 60px 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    background: #F4EEE2;
    position: relative;
  }
  .body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: radial-gradient(rgba(140,110,70,0.035) 1px, transparent 1px);
    background-size: 8px 8px;
    pointer-events: none;
  }
  .body > * { position: relative; z-index: 1; }

  /* MAIN TITLE */
  .title {
    font-family: 'Libre Baskerville', serif;
    font-weight: 700;
    color: var(--navy-deep);
    font-size: 110px;
    line-height: 1.02;
    letter-spacing: -0.015em;
    margin: 0;
  }
  .title .small { display: block; font-size: 64px; font-weight: 400; font-style: italic; color: var(--navy-deep); margin-bottom: 8px; letter-spacing: 0.02em; }
  .title em {
    color: var(--coral);
    font-style: italic;
    font-weight: 500;
  }

  /* FREE YEAR HIGHLIGHT */
  .free-card {
    background: var(--navy-deep);
    color: #fff;
    border-radius: 24px;
    padding: 38px 48px 40px;
    box-shadow: 0 24px 48px -24px rgba(14,39,70,0.5);
    position: relative;
    overflow: hidden;
    margin: 0;
    display: inline-block;
  }
  .free-card::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 240px; height: 240px;
    background: radial-gradient(circle, rgba(247,159,131,0.35), transparent 65%);
    pointer-events: none;
  }
  .free-card .free-lab {
    font-family: "Alegreya Sans", sans-serif;
    font-weight: 800;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--coral-salmon);
    font-size: 26px;
    margin-bottom: 12px;
    position: relative; z-index: 1;
  }
  .free-card .free-headline {
    font-family: 'Libre Baskerville', serif;
    font-size: 68px;
    line-height: 1.05;
    font-weight: 700;
    position: relative; z-index: 1;
  }
  .free-card .free-headline em {
    color: var(--coral-salmon);
    font-style: italic;
    font-weight: 500;
  }
  .free-card .free-headline .free-word {
    color: var(--coral-salmon);
    font-style: italic;
    font-weight: 700;
    text-transform: uppercase;
  }

  /* SUMMER ICON ROW */
  .sun-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 0 0 30px;
    color: var(--coral);
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    font-size: 38px;
    font-weight: 400;
  }
  .sun-row svg { width: 42px; height: 42px; stroke: var(--coral); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sun-row .line { width: 60px; height: 1px; background: rgba(217,119,87,0.35); }

  /* LIMITED PILL */
  .limited {
    display: inline-flex;
    align-items: center;
    gap: 16px;
    background: var(--coral);
    color: #fff;
    padding: 28px 48px;
    border-radius: 999px;
    font-family: "Alegreya Sans", sans-serif;
    font-weight: 800;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-size: 38px;
    box-shadow: 0 18px 36px -16px rgba(217,119,87,0.55);
  }
  .limited .pulse {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: #fff;
    animation: pulse 1.6s infinite;
  }
  @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.8); } 70% { box-shadow: 0 0 0 14px rgba(255,255,255,0); } }

  /* PROMISES */
  .promises {
    list-style: none;
    padding: 0;
    margin: 30px 0 0;
    display: grid;
    gap: 16px;
    text-align: left;
  }
  .promises li {
    display: grid;
    grid-template-columns: 44px 1fr;
    align-items: center;
    gap: 16px;
    font-family: 'Libre Baskerville', serif;
    font-size: 32px;
    line-height: 1.25;
    color: var(--navy-deep);
    font-weight: 500;
    white-space: nowrap;
  }
  .promises li em { color: var(--coral); font-style: italic; font-weight: 700; }
  .promises .tick {
    width: 44px; height: 44px;
    border-radius: 50%;
    background: var(--coral);
    color: #fff;
    display: grid;
    place-items: center;
    font-family: "Alegreya Sans", sans-serif;
    font-weight: 800;
    font-size: 22px;
  }

  /* BOTTOM BAR */
  .bottom-bar {
    background: var(--navy-deep);
    color: #fff;
    text-align: center;
    padding: 28px 20px;
    font-family: 'Libre Baskerville', serif;
    font-weight: 700;
    font-size: 42px;
    letter-spacing: 0.01em;
    line-height: 1.15;
  }
  .bottom-bar em {
    color: var(--coral-salmon);
    font-style: italic;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="ad">

  <div class="urgency-banner">
    <div class="lab">⚡ Last Chance ⚡</div>
    <h1 class="serif">To Join For <span class="price">£97</span></h1>
  </div>

  <div class="body">

    <h2 class="title serif">
      <span class="small">The</span>
      WLA <em>12 Week</em><br/>Summer Challenge
    </h2>

    <div class="free-card">
      <div class="free-lab">Bonus Included</div>
      <div class="free-headline serif"><span class="free-word">Free</span> Access For <em>1 Full Year</em></div>
    </div>

    <div class="limited"><span class="pulse"></span>Limited Places Left</div>

  </div>

  <div class="bottom-bar">Starts <em>Monday 8th June</em></div>

</div>

</body>
</html>
