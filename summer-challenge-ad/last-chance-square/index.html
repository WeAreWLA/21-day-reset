<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WLA Summer Challenge · Last Chance Ad (1080×1080 square)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0e2746; --navy-deep: #003060;
    --coral: #d97757; --coral-soft: #e5917a; --coral-light: #F2A48B;
    --cream: #F4EEE2; --cream-2: #E9DFD3; --beige-top: #E8DCC4;
    --paper: #FDFBF8; --muted: #5a6478;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #2a2a2a; font-family: "Alegreya Sans", sans-serif; }
  body { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
  .serif { font-family: 'Libre Baskerville', serif; }

  /* 1080x1080 ad canvas */
  .ad {
    width: 1080px; height: 1080px;
    position: relative;
    background: #F8F2E5;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    color: var(--navy-deep);
    display: flex;
    flex-direction: column;
  }
  @media (max-width: 1140px) {
    body { padding: 12px; }
    .ad { transform: scale(calc((100vw - 24px) / 1080)); transform-origin: top center; margin-bottom: calc((100vw - 24px) * (-1080 / 1080) + 24px); }
  }

  /* TOP BEIGE BANNER */
  .top-banner {
    background: linear-gradient(180deg, #EFE2CB 0%, #E8DCC4 100%);
    text-align: center;
    padding: 36px 40px;
    position: relative;
    border-bottom: 1px solid rgba(14,39,70,0.06);
  }
  /* subtle paper texture via overlapping subtle dots */
  .top-banner::after {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(rgba(140,110,70,0.05) 1px, transparent 1px),
      radial-gradient(rgba(140,110,70,0.04) 1px, transparent 1px);
    background-size: 6px 6px, 11px 11px;
    background-position: 0 0, 3px 3px;
    pointer-events: none;
  }
  .top-banner-text {
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    font-weight: 700;
    color: var(--navy-deep);
    font-size: 64px;
    letter-spacing: -0.005em;
    line-height: 1.1;
    position: relative;
    z-index: 1;
  }

  /* BODY */
  .body {
    flex: 1;
    text-align: center;
    padding: 38px 60px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    background: #F4EEE2;
    position: relative;
  }
  .body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(rgba(140,110,70,0.035) 1px, transparent 1px);
    background-size: 8px 8px;
    pointer-events: none;
  }
  .body > * { position: relative; z-index: 1; }

  .title {
    font-family: 'Libre Baskerville', serif;
    font-weight: 700;
    color: var(--navy-deep);
    font-size: 56px;
    line-height: 1.1;
    letter-spacing: -0.005em;
    margin: 0 0 22px;
  }
  .title em {
    color: var(--coral-light);
    font-style: italic;
    font-weight: 500;
  }

  .urgency {
    font-family: 'Libre Baskerville', serif;
    color: var(--navy-deep);
    font-size: 30px;
    line-height: 1.35;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 18px;
    font-weight: 400;
  }
  .urgency em { font-style: italic; font-weight: 700; }

  .free-line {
    font-family: 'Libre Baskerville', serif;
    color: var(--navy-deep);
    font-size: 46px;
    line-height: 1.1;
    font-weight: 700;
    margin: 0 0 22px;
  }
  .free-line .big {
    font-weight: 800;
  }

  /* IMAGE COLLAGE */
  .collage {
    position: relative;
    width: 100%;
    margin-top: 6px;
    flex: 1;
    min-height: 0;
  }
  .collage .card {
    position: absolute;
    background: #fff;
    border: 3px solid #fff;
    border-radius: 12px;
    box-shadow: 0 18px 36px -16px rgba(14,39,70,0.35);
    overflow: hidden;
  }
  .collage .card img {
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }

  /* fanned card positions */
  .c1 { left: 4%;   top: 14%; width: 230px; height: 280px; transform: rotate(-14deg); z-index: 2; }
  .c2 { left: 18%;  top: 4%;  width: 240px; height: 300px; transform: rotate(-7deg); z-index: 3; }
  .c3 { left: 36%;  top: 0;   width: 240px; height: 300px; transform: rotate(0deg);  z-index: 4; }
  .c4 { left: 54%;  top: 4%;  width: 240px; height: 300px; transform: rotate(7deg);  z-index: 3; }
  .c5 { left: 68%;  top: 14%; width: 230px; height: 280px; transform: rotate(14deg); z-index: 2; }
  /* foreground devices */
  .device-laptop { left: 16%; top: 40%; width: 580px; height: 360px; border-radius: 18px; background: #0e2746; padding: 18px 18px 26px; transform: rotate(-1deg); z-index: 6; box-shadow: 0 22px 44px -14px rgba(14,39,70,0.45); }
  .device-laptop img { border-radius: 6px; }
  .device-laptop::after {
    content: ''; position: absolute; left: 50%; bottom: -10px;
    width: 80px; height: 6px; background: #0e2746; border-radius: 0 0 12px 12px;
    transform: translateX(-50%);
  }
  .device-phone { left: 64%; top: 52%; width: 150px; height: 290px; border-radius: 24px; background: #0e2746; padding: 10px; transform: rotate(6deg); z-index: 7; box-shadow: 0 22px 44px -14px rgba(14,39,70,0.45); }
  .device-phone img { border-radius: 16px; }
  .device-phone::before {
    content: ''; position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 50px; height: 6px; background: #000; border-radius: 999px; z-index: 2;
  }

  /* Small caption */
  .product-caption {
    position: absolute;
    bottom: 20px; left: 0; right: 0;
    text-align: center;
    font-family: 'Libre Baskerville', serif;
    font-style: italic;
    color: var(--muted);
    font-size: 14px;
    z-index: 5;
  }

  /* BOTTOM NAVY BAR */
  .bottom-bar {
    background: var(--navy-deep);
    color: #fff;
    text-align: center;
    padding: 24px 20px;
    font-family: "Alegreya Sans", sans-serif;
    font-weight: 800;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    font-size: 28px;
  }
  .bottom-bar .light { font-weight: 400; }
</style>
</head>
<body>

<div class="ad">

  <div class="top-banner">
    <div class="top-banner-text"><em>Last Chance</em> To Join For £97</div>
  </div>

  <div class="body">

    <h1 class="title serif">Summer 12 Week <em>Fat Loss</em> Challenge</h1>

    <div class="urgency"><em>Limited</em> places left<br/>Price <em>increasing</em> to £147 soon</div>

    <div class="free-line serif">Plus 1 Full Year Of Access <span class="big">FREE</span></div>

    <div class="collage">
      <div class="card c1"><img src="/assets/jill-before-after.jpg" alt="" /></div>
      <div class="card c2"><img src="/assets/vicky-before-after.png" alt="" /></div>
      <div class="card c3"><img src="/assets/anna-before-after.png" alt="" /></div>
      <div class="card c4"><img src="/assets/barbara-before-after.png" alt="" /></div>
      <div class="card c5"><img src="/assets/ruth-before-after.jpg" alt="" /></div>

      <div class="card device-laptop"><img src="/assets/screenshot-2.jpg" alt="" /></div>
      <div class="card device-phone"><img src="/assets/screenshot-1.jpg" alt="" /></div>
    </div>

  </div>

  <div class="bottom-bar"><span class="light">Weight</span> Loss <span class="light">Academy</span></div>

</div>

</body>
</html>
