<script type="text/babel">
const { useState, useEffect } = React;

}

function Hero() {
  const [vals, setVals] = useState({ first: '', email: '' });
  const [utm, setUtm] = useState({ utm_source: '', utm_medium: '', utm_campaign: '', utm_content: '' });
  const [errs, setErrs] = useState({});
  const [loading, setLoading] = useState(false);

  // Read UTM parameters from the URL on mount
  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    setUtm({
      utm_source: params.get('utm_source') || '',
      utm_medium: params.get('utm_medium') || '',
      utm_campaign: params.get('utm_campaign') || '',
      utm_content: params.get('utm_content') || '',
    });
  }, []);

  const onChange = (k) => (e) => {
    setVals(v => ({ ...v, [k]: e.target.value }));
    setErrs(er => ({ ...er, [k]: undefined }));
  };
  const onSubmit = (e) => {
    e.preventDefault();
    const er = {};
    if (!vals.first.trim()) er.first = true;
    if (!/^\S+@\S+\.\S+$/.test(vals.email)) er.email = true;
    if (Object.keys(er).length) { setErrs(er); return; }
    setLoading(true);
    const fd = new FormData();
    fd.append('fields[name]', vals.first);
    fd.append('fields[email]', vals.email);
    if (utm.utm_source)   fd.append('fields[utm_source]',   utm.utm_source);

    if (utm.utm_campaign) fd.append('fields[utm_campaign]', utm.utm_campaign);
    if (utm.utm_content)  fd.append('fields[utm_content]',  utm.utm_content);
    fd.append('ml-submit', '1');
