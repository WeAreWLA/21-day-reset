<style id="page-styles">
  :root {
    --navy: #0e2746; --navy-deep: #091a30;
    --coral: #d97757; --coral-soft: #e5917a;
    --cream: #F9F7F4; --cream-2: #E9DFD3;
    --paper: #FDFBF8; --ink: #1a2438;
    --muted: #5a6478; --rule: #d9cdb6; --ok: #2e7d5b;
    --paypal: #ffc439; --paypal-hover: #f0b62a;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Alegreya Sans", sans-serif; color: #333333; background: var(--cream); -webkit-font-smoothing: antialiased; }
  .serif { font-family: 'Libre Baskerville', serif; font-optical-sizing: auto; }
  .italic { font-style: italic; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  img { max-width: 100%; display: block; }

  /* Announcement bar */
  @keyframes banner-shimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes dot-pulse {
    0%, 100% { transform: scale(1);    box-shadow: 0 0 0 0   rgba(245, 217, 206, 0.7); }
    50%      { transform: scale(1.25); box-shadow: 0 0 0 8px rgba(245, 217, 206, 0); }
  }
  .announcement-bar {
    background: linear-gradient(90deg, #0e2746 0%, #1a3a5e 25%, #d97757 50%, #1a3a5e 75%, #0e2746 100%);
    background-size: 260% 100%;
    animation: banner-shimmer 14s ease-in-out infinite;
    color: #f4ebdc; text-align: center;
    padding: 12px 24px;
    font-family: "Libre Baskerville", serif;
    font-size: 14px; letter-spacing: 0.02em;
  }
  .announcement-bar .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #f5d9ce; margin-right: 10px; vertical-align: middle;
    animation: dot-pulse 1.8s ease-out infinite;
  }
  .announcement-bar strong { font-weight: 700; }
  @media (max-width: 640px) { .announcement-bar { font-size: 12px; padding: 9px 14px; } }

  /* Nav */
  .nav { position: sticky; top: 0; z-index: 40; background: var(--cream); border-bottom: 1px solid rgba(14,39,70,0.06); }
  .nav-inner { max-width: 1240px; margin: 0 auto; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
  .brand { display: flex; align-items: baseline; gap: 12px; font-family: 'Libre Baskerville', serif; font-weight: 600; font-size: 22px; color: var(--navy); letter-spacing: -0.01em; }
  .brand-by { font-style: italic; color: var(--coral); font-size: 15px; font-weight: 500; }
  .nav-links { display: flex; gap: 32px; font-size: 14px; font-weight: 500; color: var(--ink); }
  .nav-links a:hover { color: var(--coral); }
  .nav-cta { background: var(--navy); color: #fff; padding: 12px 22px; border-radius: 999px; font-weight: 600; font-size: 14px; border: none; display: inline-flex; align-items: center; gap: 8px; transition: background .15s, transform .15s; }
  .nav-cta:hover { background: var(--navy-deep); transform: translateY(-1px); }
  .nav-cta .arrow { transition: transform .2s; }
  .nav-cta:hover .arrow { transform: translateX(3px); }
  @media (max-width: 880px) { .nav-links { display: none; } }
  @media (max-width: 640px) { .nav { display: none; } }

  /* Countdown banner at top of page */
  .countdown-banner { position: sticky; top: 0; z-index: 50; overflow: hidden; background: #F79F83; color: #003060; padding: 10px 16px; box-shadow: inset 0 -1px 0 rgba(14,39,70,0.12); }
  .countdown-banner::before { content: ''; position: absolute; top: 0; left: -40%; width: 40%; height: 100%; background: linear-gradient(110deg, transparent 0%, rgba(255,255,255,0.45) 50%, transparent 100%); transform: skewX(-18deg); animation: urgSheen 4.8s ease-in-out infinite; pointer-events: none; }
  @keyframes urgSheen { 0% { left: -40%; } 60% { left: 120%; } 100% { left: 120%; } }
  .countdown-inner { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; }
  .countdown-label { font-family: "Alegreya Sans", sans-serif; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; font-size: clamp(12px, 1.3vw, 14px); color: #003060; text-align: center; }
  .countdown-label .cd-nowrap { white-space: nowrap; }
  .countdown-row { display: flex; gap: 8px; }
  .cd-item { background: rgba(0,48,96,0.10); border: 1px solid rgba(0,48,96,0.18); padding: 4px 10px; border-radius: 8px; text-align: center; min-width: 44px; }
  .cd-num { display: block; font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 18px; color: #003060; line-height: 1.05; }
  .cd-lab { display: block; font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(0,48,96,0.7); font-weight: 700; margin-top: 1px; }
  .countdown-cta { background: #003060; color: #fff; padding: 8px 18px; border-radius: 999px; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; white-space: nowrap; text-decoration: none; transition: background .15s, transform .15s; }
  .countdown-cta:hover { background: var(--navy-deep); transform: translateY(-1px); }
  @media (max-width: 640px) { .countdown-banner { padding: 8px 10px; } .countdown-inner { gap: 10px; } .countdown-label { font-size: 12px; } .cd-item { padding: 3px 7px; min-width: 38px; } .cd-num { font-size: 15px; } .countdown-cta { padding: 6px 14px; font-size: 12px; } }

  /* Next Evolution of WLA section */
  .next-evolution-sub { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: clamp(18px, 2.1vw, 24px); margin-top: 12px; font-weight: 500; }
  .next-evolution-sub .ne-navy { color: #003060; }
  .next-evolution-sub .ne-coral { color: var(--coral); }
  .next-evolution p { font-size: clamp(17px, 1.8vw, 19px); line-height: 1.65; color: #333; max-width: 720px; margin: 0 auto 16px; }
  .next-evolution p strong { color: var(--navy); font-weight: 700; }

  /* Bonus sub-label */
  .bonus-sub { display: inline-block; font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--coral); font-weight: 700; padding: 3px 10px; background: rgba(217,119,87,0.14); border-radius: 999px; margin: 4px 0 8px; }

  /* Mobile-only line break helper */
  .mobile-br { display: none; }
  @media (max-width: 640px) { .mobile-br { display: inline; } }
  @media (max-width: 640px) { .mobile-tight-top { padding-top: 28px !important; } }

  /* Hero */
  .hero { max-width: 1240px; margin: 0 auto; padding: 48px 28px 40px; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 56px; align-items: start; }
  .hero-image-wrap { position: relative; }
  /* Frame matches the photo's 4:5, so it fills edge to edge with no letterbox. */
  .hero-image { aspect-ratio: 1080 / 1350; max-width: 430px; margin-left: auto; border-radius: 16px; overflow: hidden; background: var(--cream-2); box-shadow: 0 30px 60px -28px rgba(14,39,70,0.30); }
  .hero-image img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Hero overlays: the app playing, a member quote and Anna's credentials,
     the same arrangement as /wla-app. */
  .hero-cred { position: absolute; bottom: -52px; right: -26px; max-width: 236px; background: var(--paper); border: 1px solid var(--rule); border-radius: 12px; padding: 18px 22px; box-shadow: 0 20px 40px -18px rgba(80,40,20,0.25); z-index: 3; }
  .hero-cred-lab { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 13px; color: var(--coral); margin-bottom: 6px; }
  .hero-cred-name { font-family: 'Libre Baskerville', serif; font-size: 22px; color: var(--navy); margin-bottom: 2px; }
  .hero-cred-sub { font-size: 12px; color: var(--muted); letter-spacing: 0.02em; line-height: 1.4; }

  /* Inside the app: tabbed screenshot carousel, then the two clips. */
  .app-gallery-section { padding: 72px 28px 64px; background: var(--cream-2); }
  .app-gallery-inner { max-width: 1060px; margin: 0 auto; }
  /* Wide enough, and sized down just enough, to hold the heading on two lines.
     Doubled-up selectors so these beat the generic .section-head rules, which
     are declared later in the sheet. */
  .section-head.app-gallery-head { max-width: 900px; }
  .section-head.app-gallery-head h2 { font-size: clamp(25px, 3.9vw, 46px); }
  .app-carousel { display: grid; grid-template-columns: 1fr 412px; gap: 44px; align-items: center; }
  .app-tabs { display: flex; flex-direction: column; gap: 10px; }
  .app-tab { text-align: left; border: 1px solid var(--rule); border-left: 4px solid transparent; background: rgba(253,251,248,0.45); border-radius: 14px; padding: 16px 20px; display: flex; align-items: baseline; gap: 12px; transition: background .2s, border-color .2s; }
  .app-tab.is-on { border-color: var(--coral); border-left-color: var(--coral); background: var(--paper); }
  .app-tab b { font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: 18px; color: var(--navy); flex: none; }
  .app-tab span { font-size: 15px; line-height: 1.35; color: var(--muted); }
  .app-tab.is-on span { color: var(--coral); }
  .app-stage { display: flex; align-items: center; gap: 12px; }
  .app-phone { flex: 1; min-width: 0; aspect-ratio: 1004 / 2000; border-radius: 34px; border: 9px solid var(--navy); overflow: hidden; background: var(--cream); box-shadow: 0 34px 64px -28px rgba(14,39,70,0.5); position: relative; }
  .app-phone img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center; opacity: 0; transition: opacity .45s ease; }
  .app-phone img.is-on { opacity: 1; }
  .app-arrow { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--rule); background: var(--paper); color: var(--navy); display: grid; place-items: center; padding: 0; box-shadow: 0 14px 28px -14px rgba(14,39,70,0.45); }
  .app-dots { display: flex; justify-content: center; gap: 8px; margin-top: 18px; }
  .app-dots button { width: 9px; height: 9px; border-radius: 999px; border: none; padding: 0; background: rgba(14,39,70,0.22); transition: width .25s, background .25s; }
  .app-dots button.is-on { width: 26px; background: var(--coral); }
  .app-phone-caption { display: none; text-align: center; margin-top: 12px; }
  .app-phone-caption em { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 17px; color: var(--navy); }
  .app-phone-caption span { display: block; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-top: 8px; }
  .app-clips-section { padding: 64px 28px 56px; background: var(--cream); }
  .app-clips-inner { max-width: 900px; margin: 0 auto; }
  .app-clip-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 48px; max-width: 680px; margin: 0 auto; }
  .app-clip-col { text-align: center; }
  .app-clip-col h3 { font-family: 'Libre Baskerville', serif; font-size: 21px; color: var(--navy); margin: 0 0 2px; }
  .app-clip-col p { font-size: 15px; color: var(--muted); margin: 0 0 16px; }
  .app-clip-phone { aspect-ratio: 1004 / 2000; border-radius: 30px; border: 8px solid var(--navy); overflow: hidden; background: var(--cream); box-shadow: 0 30px 60px -26px rgba(14,39,70,0.5); }
  .app-clip-phone video { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
  @media (max-width: 980px) {
    .app-gallery-section { padding: 48px 16px 44px; }
    .app-carousel { grid-template-columns: 1fr; gap: 26px; }
    .app-tabs { display: none; }
    .app-phone-caption { display: block; }
    .app-carousel > div:last-child { width: min(348px, 100%); margin: 0 auto; }
    .app-stage { gap: 8px; }
    .app-clips-section { padding: 44px 16px 40px; }
    .app-clip-grid { grid-template-columns: 1fr; gap: 36px; }
    .app-clip-col { width: min(270px, 72vw); margin: 0 auto; }
  }
  .hero-emphasis { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: clamp(20px, 2.2vw, 26px); line-height: 1.3; color: var(--coral); font-weight: 700; margin: 4px 0 12px; }
  .spots-note { display: inline-block; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin: 0 0 18px; padding: 6px 14px; background: rgba(14,39,70,0.06); border-radius: 999px; }
  /* Hero promises (3-item promise list) */
  .hero-promises { list-style: none; padding: 0; margin: 0 0 12px; display: grid; gap: 10px; max-width: 540px; }
  .hero-promises li { display: flex; align-items: flex-start; gap: 12px; font-family: 'Libre Baskerville', serif; font-size: 17px; line-height: 1.4; color: var(--navy); }
  .hero-promises .hp-mark { flex: none; width: 26px; height: 26px; border-radius: 50%; background: rgba(217,119,87,0.18); color: var(--coral); display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 1px; }
  .hero-promises li strong { color: var(--navy); font-weight: 700; }
  .hero-without { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: clamp(16px, 1.6vw, 18px); line-height: 1.45; color: var(--navy); max-width: 540px; margin: 0 0 22px; }

  /* Hero promo details (start date + offer + access) */
  .promo-details { max-width: 540px; padding: 18px 22px; background: var(--paper); border: 1px solid rgba(14,39,70,0.08); border-left: 4px solid var(--coral); border-radius: 12px; box-shadow: 0 12px 24px -20px rgba(14,39,70,0.18); margin: 0 0 16px; }
  .promo-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .promo-item { flex: 1 1 0; min-width: 0; text-align: center; }
  .promo-item .promo-lab { font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 4px; }
  .promo-item .promo-val { font-family: 'Libre Baskerville', serif; font-weight: 700; color: var(--navy); font-size: 16px; line-height: 1.2; }
  .promo-item .promo-val .coral { color: var(--coral); font-style: italic; font-weight: 500; }
  .promo-divider { flex: none; width: 1px; height: 36px; background: rgba(14,39,70,0.12); }
  .promo-note { margin-top: 10px; padding-top: 10px; border-top: 1px solid rgba(14,39,70,0.08); text-align: center; font-size: 11.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--coral); font-weight: 700; }
  @media (max-width: 540px) { .promo-row { flex-direction: column; gap: 12px; } .promo-divider { width: 80%; height: 1px; } }

  /* Hero offer card (single-sentence flow) */
  .hero-offer-card { max-width: 540px; padding: 20px 24px; background: var(--paper); border: 1px solid rgba(14,39,70,0.08); border-left: 4px solid var(--coral); border-radius: 12px; box-shadow: 0 18px 36px -22px rgba(14,39,70,0.22); margin: 0 0 18px; }
  .hero-offer-line-1, .hero-offer-line-2 { font-family: 'Libre Baskerville', serif; font-weight: 700; color: var(--navy); font-size: clamp(19px, 2.1vw, 24px); line-height: 1.3; }
  .hero-offer-line-1 em, .hero-offer-line-2 em { color: var(--coral); font-style: italic; font-weight: 500; }
  .hero-offer-line-2 { margin-bottom: 6px; }
  .hero-offer-line-3 { font-family: 'Libre Baskerville', serif; font-weight: 700; color: var(--navy); font-size: clamp(19px, 2.1vw, 24px); line-height: 1.3; margin-top: 6px; }
  .hero-offer-line-3 s { color: var(--muted); font-weight: 500; text-decoration-thickness: 1.5px; }
  .hero-offer-line-3 strong { color: var(--coral); font-style: italic; font-weight: 700; }
  .hero-offer-limit { display: inline-block; margin-top: 14px; padding: 8px 16px; background: var(--coral); color: #fff; border-radius: 18px; font-size: 14.5px; font-weight: 700; line-height: 1.35; }
  .hero-offer-app { font-size: 16px; font-weight: 600; color: var(--ink); margin: 2px 0 12px; }
  .hero-offer-app::before { content: '✓'; color: var(--coral); font-weight: 800; margin-right: 8px; }

  .hero-offer { margin: 4px 0 12px; padding: 18px 22px; background: var(--paper); border: 1px solid rgba(14,39,70,0.08); border-left: 4px solid var(--coral); border-radius: 12px; max-width: 540px; box-shadow: 0 12px 24px -20px rgba(14,39,70,0.18); }
  .hero-offer-line { font-family: 'Libre Baskerville', serif; font-size: clamp(20px, 2.1vw, 24px); line-height: 1.3; color: var(--navy); font-weight: 700; margin-bottom: 6px; }
  .hero-offer-line em { color: var(--coral); font-style: italic; font-weight: 500; }
  .hero-offer-sub { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 14.5px; line-height: 1.45; color: var(--muted); }
  .hero-cta-row { margin-top: 18px; max-width: 480px; }
  .hero-start-date { margin-top: 16px; max-width: 480px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--cream-2); border-radius: 12px; font-size: 15px; line-height: 1.4; color: var(--ink); }
  .hero-start-date strong { color: var(--navy); }
  .hero-start-ic { flex: none; width: 34px; height: 34px; border-radius: 10px; background: var(--paper); color: var(--coral); display: grid; place-items: center; }

  @media (max-width: 980px) { .hero-start-date { max-width: 100%; } }
  .hero-fine-print { margin-top: 16px; max-width: 540px; font-size: 15px; line-height: 1.55; color: var(--muted); }

  /* Payment option cards */
  .pay-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 540px; margin: 18px 0 0; }
  .pay-option { background: var(--paper); border: 1px solid rgba(14,39,70,0.10); border-radius: 12px; padding: 14px 16px; box-shadow: 0 12px 24px -18px rgba(14,39,70,0.18); }
  .pay-option-lab { font-size: 10.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--coral); font-weight: 800; margin-bottom: 6px; }
  .pay-option-val { font-family: 'Libre Baskerville', serif; font-size: 14.5px; line-height: 1.4; color: var(--navy); font-weight: 500; }
  .pay-option-val strong { color: var(--navy); font-weight: 700; }

  .story-cycle p:last-child { margin-bottom: 0; font-style: normal; font-weight: 700; color: var(--coral); font-size: 19px; }
  /* Woman Who Keeps It Off */

  /* 12 Week Timeline */

  .drop-lead { text-align: center; font-family: 'Libre Baskerville', serif; font-style: italic; font-size: clamp(18px, 2vw, 21px); color: var(--navy); margin: 30px 0 20px; }

  .drop-col-head { background: rgba(14,39,70,0.62); color: #fff; font-family: "Alegreya Sans", sans-serif; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; font-size: 13px; text-align: center; padding: 13px 10px; }

  .timeline-section { background: var(--cream); }

  .places-meter { max-width: 720px; margin: 28px auto 0; padding: 20px 24px; background: var(--paper); border: 1px solid rgba(14,39,70,0.08); border-radius: 14px; box-shadow: 0 18px 36px -28px rgba(14,39,70,0.22); }

  .places-fill { height: 100%; width: 90.6%; background: linear-gradient(90deg, var(--coral), var(--coral-soft)); border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2); position: relative; min-width: 16px; }

  /* The 11 years / 50,000 women insight. The numbers are the reason the block
     exists, so they are set as figures rather than buried in the sentence, the
     prose is left aligned so it can actually be read, and it is signed, because
     it is Anna's observation and the rest of the page is her voice. */
  .insight { margin-top: 30px; display: grid; grid-template-columns: 210px 1fr; background: var(--navy); border-radius: 16px; overflow: hidden; box-shadow: 0 24px 48px -30px rgba(14,39,70,0.4); }

  .insight-stats .l { display: block; margin-top: 7px; font-size: 12.5px; letter-spacing: 0.12em; text-transform: uppercase; color: rgba(255,255,255,0.72); line-height: 1.3; }

  @media (max-width: 760px) {

  /* The section was peaking at the insight card and then trailing off into

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const OFFER_END = new Date('2026-12-07T00:00:00').getTime(); // price increases Mon 7 Dec
const OFFER_END_TEXT = 'midnight on Sunday 6th December';
const OFFER_END_SHORT = 'Sunday 6th December';

// Countdown numbers in the top banner. Off for now; set to true to bring the timer back.
const SHOW_TIMER = false;

);

function CountdownBanner() {
  // Counts down to OFFER_END.
  // Phase 1: more than 24 hours left -> "Black Friday Promo · First 100 Places at £37"
  // Phase 2: final 24 hours          -> "Last Chance · Black Friday Price Ends Tonight"
  // Phase 3: deadline passed         -> static "The Black Friday promo has now ended"
  const computePhase = (now) => (now >= OFFER_END ? 3 : OFFER_END - now <= 86400000 ? 2 : 1);

  const [time, setTime] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0, phase: computePhase(Date.now()) });
  useEffect(() => {
    const tick = () => {
      const now = Date.now();
      const phase = computePhase(now);
      if (phase === 3) { setTime({ days: 0, hours: 0, minutes: 0, seconds: 0, phase }); return; }
      const diff = Math.max(0, OFFER_END - now);
      setTime({
        days: Math.floor(diff / 86400000),
        hours: Math.floor((diff % 86400000) / 3600000),
        minutes: Math.floor((diff % 3600000) / 60000),
        seconds: Math.floor((diff % 60000) / 1000),
        phase,
      });
    };
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, []);
  const pad = (n) => String(n).padStart(2, '0');
  if (time.phase === 3) {
    return (
      <div className="countdown-banner">
        <div className="countdown-inner">
          <span className="countdown-label">The Black Friday promo has now ended</span>
        </div>
      </div>
    );
  }
  const label = time.phase === 2
    ? 'Last Chance · Black Friday Price Ends Tonight'
    : <><span className="cd-nowrap">Black Friday Promo ·</span> <span className="cd-nowrap">First 100 Places at £37</span></>;
  return (
    <div className="countdown-banner">
      <div className="countdown-inner">
        <span className="countdown-label">{label}</span>
        {SHOW_TIMER && <div className="countdown-row">
          <div className="cd-item"><span className="cd-num">{time.days}</span><span className="cd-lab">days</span></div>
          <div className="cd-item"><span className="cd-num">{pad(time.hours)}</span><span className="cd-lab">hrs</span></div>
          <div className="cd-item"><span className="cd-num">{pad(time.minutes)}</span><span className="cd-lab">mins</span></div>
          <div className="cd-item"><span className="cd-num">{pad(time.seconds)}</span><span className="cd-lab">secs</span></div>
        </div>}
      </div>
    </div>
  );
}

function AppGallery() {
  const [i, setI] = React.useState(0);
  const [paused, setPaused] = React.useState(false);
  const n = APP_SCREENS.length;
  const touch = React.useRef(null);
  const go = (next) => { setPaused(true); setI(((next % n) + n) % n); };

  React.useEffect(() => {
    if (paused) return;
    const id = setInterval(() => setI((p) => (p + 1) % n), 4200);
    return () => clearInterval(id);
  }, [paused, n]);

  const onTouchStart = (e) => { touch.current = e.touches[0].clientX; };
  const onTouchEnd = (e) => {
    if (touch.current === null) return;
    const dx = e.changedTouches[0].clientX - touch.current;
    if (Math.abs(dx) > 40) go(dx < 0 ? i + 1 : i - 1);
    touch.current = null;
  };

  return (
    <section className="app-gallery-section">
      <div className="app-gallery-inner">
        <div className="section-head app-gallery-head">
          <span className="eyebrow">Inside the app</span>
          <h2 className="serif">Everything you need to lose weight<br/><em>&amp; keep it off, in one simple app.</em></h2>
        </div>

        <div className="app-carousel">
          <div className="app-tabs">
            {APP_SCREENS.map((sc, idx) => (
              <button key={sc.tab} type="button" onClick={() => go(idx)}
                      className={idx === i ? 'app-tab is-on' : 'app-tab'}>
                <b>{sc.tab}</b><span>{sc.cap}</span>
              </button>
            ))}
          </div>

          <div onMouseEnter={() => setPaused(true)} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
            <div className="app-stage">
              <AppArrow side="prev" onClick={() => go(i - 1)} />
              <div className="app-phone">
                {APP_SCREENS.map((sc, idx) => (
                  <img key={sc.img} src={sc.img} alt={sc.tab + ' \u2014 ' + sc.cap}
                       loading={idx === 0 ? 'eager' : 'lazy'} decoding="async"
                       className={idx === i ? 'is-on' : ''} />
                ))}
              </div>
              <AppArrow side="next" onClick={() => go(i + 1)} />
            </div>

            <div className="app-dots">
              {APP_SCREENS.map((sc, idx) => (
                <button key={sc.tab} type="button" aria-label={sc.tab} onClick={() => go(idx)}
                        className={idx === i ? 'is-on' : ''} />
              ))}
            </div>

            <div className="app-phone-caption">
              <em>{APP_SCREENS[i].cap}</em>
              <span>Swipe or tap the arrows</span>
            </div>
          </div>
        </div>
      </div>
    </section>
  );
}

function AppClips() {
  const wrap = React.useRef(null);

  React.useEffect(() => {
    const el = wrap.current;
    if (!el || typeof IntersectionObserver === 'undefined') return;
    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        const v = entry.target;
        if (entry.isIntersecting) { const r = v.play(); if (r && r.catch) r.catch(() => {}); }
        else v.pause();
      });
    }, { threshold: 0.35 });
    el.querySelectorAll('video').forEach((v) => io.observe(v));
    return () => io.disconnect();
  }, []);

  return (
    <section className="app-clips-section">
      <div className="app-clips-inner">
        <div className="section-head">
          <span className="eyebrow">See it in action</span>
          <h2 className="serif">Two taps, <em>and your week is sorted.</em></h2>
        </div>
        <div className="app-clip-grid" ref={wrap}>

            <div className="app-clip-col" key={c.stem}>
              <h3>{c.tab}</h3>
              <p>{c.cap}</p>
              <div className="app-clip-phone">
                <video poster={c.stem + '-poster.jpg'} muted loop playsInline preload="none"
                       aria-label={c.tab + ' \u2014 ' + c.cap}>
                  <source src={c.stem + '.webm'} type="video/webm" />
                  <source src={c.stem + '.mp4'} type="video/mp4" />
                </video>
              </div>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function Results() {
  const tiles = [
    { name: 'Vicky, 56',  img: '/assets/vicky-before-after.png' },
    { name: 'Jill, 52',   img: '/assets/jill-before-after.jpg' },
    { name: 'Ruth, 54',   img: '/assets/ruth-before-after.jpg' },
    { name: 'Barbara, 58',img: '/assets/barbara-before-after.png' },
    { name: 'Member 5',   img: '/assets/member-05-before-after.png' },
    { name: 'Member 6',   img: '/assets/member-06-before-after.png' },
    { name: 'Member 7',   img: '/assets/member-07-before-after.png' },
    { name: 'Member 8',   img: '/assets/member-08-before-after.jpeg' },
    { name: 'Member 9',   img: '/assets/member-09-before-after.png' },
    { name: 'Member 10',  img: '/assets/member-10-before-after.png' },
    { name: 'Member 11',  img: '/assets/member-11-before-after.png' },
    { name: 'Member 12',  img: '/assets/member-12-before-after.png' },
  ];
  const trackRef = useRef(null);
  const [page, setPage] = useState(0);
  const [pageCount, setPageCount] = useState(1);

  const recompute = useCallback(() => {
    const track = trackRef.current; if (!track) return;
    const tile = track.querySelector('.results-tile'); if (!tile) return;
    const colWidth = tile.offsetWidth + 16;
    const visibleCols = Math.max(1, Math.round(track.clientWidth / colWidth));
    const totalCols = Math.ceil(tiles.length / 2);
    const count = Math.max(1, totalCols - visibleCols + 1);
    setPageCount(count);
    setPage(Math.min(Math.round(track.scrollLeft / colWidth), count - 1));
  }, [tiles.length]);

  useEffect(() => {
    recompute();
    const track = trackRef.current; if (!track) return;
    let frame;
    const onScroll = () => {
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        const tile = track.querySelector('.results-tile'); if (!tile) return;
        const tileWidth = tile.offsetWidth + 16;
        setPage(Math.round(track.scrollLeft / tileWidth));
      });
    };
    track.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', recompute);
    return () => {
      track.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', recompute);
      cancelAnimationFrame(frame);
    };
  }, [recompute]);

  const goTo = (idx) => {
    const track = trackRef.current; if (!track) return;
    const tile = track.querySelector('.results-tile'); if (!tile) return;
    track.scrollTo({ left: idx * (tile.offsetWidth + 16), behavior: 'smooth' });
  };
  const scrollBy = (dir) => goTo(Math.min(Math.max(page + dir, 0), pageCount - 1));

  return (
    <section className="results" id="results" style={{ paddingBottom: 48 }}>
      <div className="section-head">
        <span className="eyebrow">Real women · Real results · Results that last</span>
        <h2 className="serif">See why so many women<br/><em>live by the WLA.</em></h2>
      </div>
      <div className="results-carousel">
        <div className="results-track">
          {tiles.map((t, i) => (
            <div className="results-tile" key={i}>
              <img src={t.img} alt={`Before and after of ${t.name}`} loading="lazy" decoding="async" />
            </div>
          ))}
        </div>
      </div>
      <p className="results-disclaimer">*Results vary depending on the individual. There is no guarantee of specific results.</p>
    </section>
  );
}

function StickyCTA() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const onScroll = () => {
      setShow(window.scrollY > 900 && window.scrollY < document.body.scrollHeight - 1200);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <div className={'sticky-cta' + (show ? ' show' : '')}>
      <div className="text">
        <strong>January Challenge · £37 · Instant Access</strong>
      </div>
      <div className="sticky-cta-buttons">

        </a>
      </div>
    </div>
  );
}
