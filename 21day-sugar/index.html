  /* Venn diagram (How It Works): legacy, no longer used */
  .venn { position: relative; width: min(380px, 92vw); aspect-ratio: 1 / 1; margin: 36px auto 40px; }
  .venn-circle { position: absolute; width: 65%; aspect-ratio: 1 / 1; border-radius: 50%; display: grid; place-items: center; text-align: center; padding: 16px; font-family: 'Libre Baskerville', serif; font-style: italic; font-weight: 700; font-size: clamp(12px, 1.4vw, 15px); line-height: 1.2; box-sizing: border-box; }
  .venn-circle span { display: block; }

  /* App bonus callout (above Behind The Scenes) */

  .total-value .price-note { margin-top: 20px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.14); font-size: 13.5px; letter-spacing: 0.04em; color: rgba(244,235,220,0.85); font-family: "Alegreya Sans", sans-serif; position: relative; z-index: 1; }

  .offer-price::before { content: ''; position: absolute; top: -80px; right: -80px; width: 220px; height: 220px; background: radial-gradient(circle, rgba(229,145,122,0.28), transparent 65%); pointer-events: none; }

  /* App features section */

  .app .intro { max-width: 820px; margin: 0 auto 56px; text-align: center; font-size: 17px; line-height: 1.65; color: rgba(244,235,220,0.88); }

  .app-grid { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
  .app-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.10); border-radius: 16px; padding: 30px 32px; display: grid; grid-template-columns: 48px 1fr; column-gap: 20px; row-gap: 10px; align-items: start; transition: transform .2s, border-color .2s; }
  .app-card:hover { transform: translateY(-4px); border-color: rgba(229,145,122,0.4); }
  .app-card .star { width: 48px; height: 48px; border-radius: 12px; background: rgba(229,145,122,0.15); color: var(--coral-soft); display: grid; place-items: center; font-size: 22px; line-height: 1; grid-row: 1 / span 2; }
  .app-card h3 { font-family: 'Libre Baskerville', serif; font-size: 19px; color: #fff; margin: 0; font-weight: 700; line-height: 1.25; align-self: center; }
  .app-card p { font-size: 15px; line-height: 1.55; color: rgba(244,235,220,0.85); margin: 0; grid-column: 2; }
  @media (max-width: 640px) { .app-grid { grid-template-columns: 1fr; } .app { padding: 64px 22px; } .app-card { padding: 24px 22px; grid-template-columns: 40px 1fr; column-gap: 16px; } .app-card .star { width: 40px; height: 40px; font-size: 18px; } }

  /* Coming soon section */
  .coming { padding: 96px 28px; background: var(--cream-2); border-top: 1px solid rgba(14,39,70,0.06); }
  .coming-inner { max-width: 1100px; margin: 0 auto; }

  .coming-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
  .coming-card { background: var(--paper); border: 1px solid rgba(14,39,70,0.08); border-radius: 16px; padding: 28px 28px; display: flex; flex-direction: column; gap: 12px; position: relative; }
  .coming-card .rocket { position: absolute; top: -14px; left: 24px; background: var(--coral); color: #fff; font-size: 10px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; padding: 6px 14px; border-radius: 999px; }
  .coming-card h3 { font-family: 'Libre Baskerville', serif; font-size: 19px; color: var(--navy); margin: 6px 0 0; font-weight: 700; line-height: 1.25; }

  /* Results / Before-after carousel (matched to /free-reset) */
  .results { padding: 80px 28px; background: var(--cream); }
  .results .section-head h2 { color: var(--navy); }
  .results .section-head h2 em { color: var(--coral); }
  .results-carousel { position: relative; max-width: 1240px; margin: 0 auto; }
  .results-track { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; padding: 4px 0 20px; }
  .results-track::-webkit-scrollbar { display: none; }
  .results-tile { min-width: 0; scroll-snap-align: start; aspect-ratio: 1 / 1; border-radius: 6px; overflow: hidden; background: var(--paper); border: 1px solid rgba(14,39,70,0.08); box-sizing: border-box; }
  .results-tile img { width: 100%; height: 100%; object-fit: contain; display: block; background: var(--paper); }
  .results-nav { position: absolute; top: 46%; transform: translateY(-50%); z-index: 5; width: 48px; height: 48px; border-radius: 50%; background: var(--navy); border: none; color: var(--paper); font-family: "Alegreya Sans", sans-serif; font-size: 22px; font-weight: 500; line-height: 1; display: grid; place-items: center; cursor: pointer; box-shadow: 0 18px 32px -14px rgba(14,39,70,0.45); transition: transform .15s, background .15s; padding: 0; }
  .results-nav:hover { background: var(--navy-deep); transform: translateY(-50%) scale(1.06); }
  .results-nav:disabled { opacity: 0.35; cursor: not-allowed; }
  .results-nav.prev { left: -22px; }
  .results-nav.next { right: -22px; }
  .results-dots { display: flex; justify-content: center; gap: 8px; margin-top: 8px; }
  .results-dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(14,39,70,0.18); border: none; padding: 0; cursor: pointer; transition: background .15s, transform .15s; }
  .results-dot.active { background: var(--coral); transform: scale(1.3); }

  @media (max-width: 980px) { .results-track { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .results-track { grid-auto-columns: calc((100% - 16px) / 2); } .results { padding: 64px 22px; } .results-nav { width: 40px; height: 40px; font-size: 20px; } .results-nav.prev { left: -6px; } .results-nav.next { right: -6px; } }

  /* Before vs After WLA Lifestyle table */
  .compare { padding: 96px 28px; background: var(--paper); border-top: 1px solid rgba(14,39,70,0.06); }
  .compare-inner { max-width: 980px; margin: 0 auto; }
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

  @media (max-width: 720px) { .compare-grid { grid-template-columns: 1fr; } .compare-col h3 { font-size: 20px; } }

  /* Limited founding member offer */
  .limited { padding: 96px 28px; background: var(--cream); border-top: 1px solid rgba(14,39,70,0.06); position: relative; overflow: hidden; }
  .limited::before { content: ''; position: absolute; top: -160px; left: -120px; width: 420px; height: 420px; background: radial-gradient(circle, rgba(217,119,87,0.18), transparent 65%); pointer-events: none; }

  /* Scarcity meter */
  .scarcity { max-width: 540px; margin: 0 auto 48px; padding: 24px 28px; background: var(--paper); border: 1px solid rgba(14,39,70,0.08); border-radius: 16px; box-shadow: 0 18px 36px -24px rgba(14,39,70,0.18); }

  /* Two-card compare: doors close vs founding members */
  .limited-cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; margin-bottom: 36px; }
  .limited-card { padding: 28px 28px; border-radius: 16px; border: 1px solid rgba(14,39,70,0.08); background: var(--paper); position: relative; }

  .limited-card li { display: flex; gap: 12px; align-items: flex-start; font-size: 15.5px; color: #333; line-height: 1.45; padding-bottom: 12px; border-bottom: 1px solid rgba(14,39,70,0.06); }
  .limited-card li:last-child { border-bottom: none; padding-bottom: 0; }

  .limited-card.win  li::before { content: '✓'; color: var(--ok); font-weight: 700; flex: none; width: 16px; }

  .limited-closing { max-width: 720px; margin: 0 auto; padding: 28px 32px; background: var(--navy); color: #f4ebdc; border-radius: 16px; box-shadow: 0 20px 40px -20px rgba(14,39,70,0.35); }

  @media (max-width: 720px) { .limited-cards { grid-template-columns: 1fr; } .scarcity-top { flex-direction: column; align-items: flex-start; gap: 6px; } }

  /* Final CTA */

  .final-cta-inner { max-width: 720px; margin: 0 auto; background: var(--cream); border-radius: 24px; padding: 56px 40px; border: 1px solid rgba(14,39,70,0.08); box-shadow: 0 30px 60px -30px rgba(14,39,70,0.2); }

  /* Sticky CTA bar */

    position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 60;

// Doors close Sunday 2nd August 2026, 11.59pm
const DOORS_CLOSE = new Date('2026-08-02T23:59:00').getTime();
// Countdown ends Sunday night, but late joiners can still get in through
// the kick-off Monday. Doors hard-close at midnight ending Monday 3rd Aug.
const FINAL_CLOSE = new Date('2026-08-04T00:00:00').getTime();

function CountdownBanner({ label }) {
  const [time, setTime] = useState({ days: 0, hours: 0, minutes: 0, seconds: 0, phase: 'counting' });
  useEffect(() => {
    const tick = () => {
      const now = Date.now();
      const diff = DOORS_CLOSE - now;
      if (now >= FINAL_CLOSE) { setTime({ days: 0, hours: 0, minutes: 0, seconds: 0, phase: 'closed' }); return; }
      if (diff <= 0) { setTime({ days: 0, hours: 0, minutes: 0, seconds: 0, phase: 'lastcall' }); return; }
      setTime({
        days: Math.floor(diff / 86400000),
        hours: Math.floor((diff % 86400000) / 3600000),
        minutes: Math.floor((diff % 3600000) / 60000),
        seconds: Math.floor((diff % 60000) / 1000),
        phase: 'counting',
      });
    };
    tick();
    const id = setInterval(tick, 1000);
    return () => clearInterval(id);
  }, []);
  const pad = (n) => String(n).padStart(2, '0');
  if (time.phase === 'closed') {
    return (
      <div className="countdown-banner">
        <div className="countdown-inner">

          <div className="cd-item"><span className="cd-num">{pad(time.minutes)}</span><span className="cd-lab">mins</span></div>
          <div className="cd-item"><span className="cd-num">{pad(time.seconds)}</span><span className="cd-lab">secs</span></div>
        </div>
      </div>
    </div>
  );
