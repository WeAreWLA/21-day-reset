<style id="page-styles">
  :root {
    --navy: #0e2746; --navy-deep: #091a30;
    --coral: #d97757; --coral-soft: #e5917a;
    --cream: #F9F7F4; --cream-2: #E9DFD3;
    --paper: #FDFBF8; --ink: #1a2438;
    --muted: #5a6478; --rule: #d9cdb6; --ok: #2e7d5b;
    --paypal: #ffc439; --paypal-hover: #f0b62a;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Alegreya Sans", sans-serif; color: #333333; background: var(--cream); -webkit-font-smoothing: antialiased; }
  .serif { font-family: 'Libre Baskerville', serif; font-optical-sizing: auto; }
  .italic { font-style: italic; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  img { max-width: 100%; display: block; }

  /* Announcement bar */
  @keyframes banner-shimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes dot-pulse {
    0%, 100% { transform: scale(1);    box-shadow: 0 0 0 0   rgba(245, 217, 206, 0.7); }
    50%      { transform: scale(1.25); box-shadow: 0 0 0 8px rgba(245, 217, 206, 0); }
  }
  .announcement-bar {
    background: linear-gradient(90deg, #0e2746 0%, #1a3a5e 25%, #d97757 50%, #1a3a5e 75%, #0e2746 100%);
    background-size: 260% 100%;
    animation: banner-shimmer 14s ease-in-out infinite;
    color: #f4ebdc; text-align: center;
    padding: 12px 24px;
    font-family: "Libre Baskerville", serif;
    font-size: 14px; letter-spacing: 0.02em;
  }
  .announcement-bar .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #f5d9ce; margin-right: 10px; vertical-align: middle;
    animation: dot-pulse 1.8s ease-out infinite;
  }
  .announcement-bar strong { font-weight: 700; }
  @media (max-width: 640px) { .announcement-bar { font-size: 12px; padding: 9px 14px; } }

  /* Nav */
  .nav { position: sticky; top: 0; z-index: 40; background: var(--cream); border-bottom: 1px solid rgba(14,39,70,0.06); }
  .nav-inner { max-width: 1240px; margin: 0 auto; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; gap: 32px; }
  .brand { display: flex; align-items: baseline; gap: 12px; font-family: 'Libre Baskerville', serif; font-weight: 600; font-size: 22px; color: var(--navy); letter-spacing: -0.01em; }
  .brand-by { font-style: italic; color: var(--coral); font-size: 15px; font-weight: 500; }
  .nav-links { display: flex; gap: 32px; font-size: 14px; font-weight: 500; color: var(--ink); }
  .nav-links a:hover { color: var(--coral); }
  .nav-cta { background: var(--navy); color: #fff; padding: 12px 22px; border-radius: 999px; font-weight: 600; font-size: 14px; border: none; display: inline-flex; align-items: center; gap: 8px; transition: background .15s, transform .15s; }
  .nav-cta:hover { background: var(--navy-deep); transform: translateY(-1px); }
  .nav-cta .arrow { transition: transform .2s; }
  .nav-cta:hover .arrow { transform: translateX(3px); }
  @media (max-width: 880px) { .nav-links { display: none; } }
  @media (max-width: 640px) { .nav { display: none; } }

  /* Hero */
  .hero { max-width: 1240px; margin: 0 auto; padding: 48px 28px 56px; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 64px; align-items: center; }
  .eyebrow { display: inline-flex; align-items: center; gap: 12px; color: var(--coral); font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 24px; }
  .eyebrow::before { content: ''; width: 28px; height: 2px; background: var(--coral); display: inline-block; }
  .founding-tag { display: inline-flex; align-items: center; gap: 10px; padding: 8px 16px; border-radius: 999px; background: rgba(217,119,87,0.12); color: var(--coral); font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 22px; }
  .founding-tag::before, .founding-tag::after { content: '✦'; font-size: 11px; }
  .h1 { font-family: 'Libre Baskerville', serif; color: var(--navy); font-size: clamp(36px, 4.6vw, 60px); line-height: 1.1; font-weight: 700; margin: 0 0 18px; letter-spacing: -0.01em; }
  .h1 .accent { color: var(--coral); font-style: italic; font-weight: 500; }
  .h1-sub { font-family: 'Libre Baskerville', serif; font-size: clamp(18px, 1.9vw, 22px); line-height: 1.45; color: var(--navy); margin: 0 0 24px; font-weight: 400; }
  .lede { font-size: 17.5px; line-height: 1.55; color: #333; margin: 0 0 24px; max-width: 560px; }
  .lede strong { color: var(--navy); font-weight: 700; }
  .bullet-list { list-style: none; padding: 0; margin: 0 0 28px; display: grid; gap: 12px; max-width: 560px; }
  .bullet-list li { display: flex; gap: 14px; align-items: flex-start; font-size: 16px; color: #333333; line-height: 1.45; }
  .check { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--navy); display: grid; place-items: center; margin-top: 1px; }
  .check svg { width: 12px; height: 12px; stroke: var(--cream); stroke-width: 2.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }

  /* Hero offer card */
  .hero-card { background: var(--paper); border: 1px solid rgba(14,39,70,0.08); border-radius: 20px; padding: 36px 32px 30px; box-shadow: 0 30px 60px -30px rgba(14,39,70,0.25), 0 8px 20px -10px rgba(14,39,70,0.10); position: relative; }
  .hero-card .pill { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); background: var(--coral); color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; padding: 7px 18px; border-radius: 999px; white-space: nowrap; }
  .hero-card .seats { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 600; text-align: center; margin-bottom: 12px; }
  .hero-card .price-row { text-align: center; margin-bottom: 6px; }

  .hero-card .includes li { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; color: var(--navy); line-height: 1.4; }
  .hero-card .includes li::before { content: '✔'; color: var(--coral); font-weight: 700; flex: none; }
  .hero-card .includes em { color: var(--coral); font-style: italic; font-weight: 500; }

  .cta-btn { width: 100%; background: var(--navy); color: #fff; padding: 18px 22px; border-radius: 12px; border: none; font-weight: 700; font-size: 16px; letter-spacing: 0.01em; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: background .15s, transform .15s; text-decoration: none; line-height: 1.2; text-align: center; }
  .cta-btn:hover { background: var(--navy-deep); transform: translateY(-1px); }
  .cta-btn .arrow { transition: transform .2s; }
  .cta-btn:hover .arrow { transform: translateX(3px); }
  .cta-btn.coral { background: var(--coral); }
  .cta-btn.coral:hover { background: #c2603f; }

  .or-divider { display: flex; align-items: center; gap: 12px; margin: 14px 0; color: var(--muted); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
  .or-divider::before, .or-divider::after { content: ''; flex: 1; height: 1px; background: rgba(14,39,70,0.12); }

  .paypal-btn { width: 100%; background: var(--paypal); color: #003087; padding: 16px 22px; border-radius: 12px; border: none; font-weight: 700; font-size: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: background .15s, transform .15s; text-decoration: none; }
  .paypal-btn:hover { background: var(--paypal-hover); transform: translateY(-1px); }
  .paypal-btn .pp-logo { font-style: italic; font-weight: 800; font-size: 18px; letter-spacing: -0.02em; }
  .paypal-btn .pp-logo .pp-pay { color: #003087; }
  .paypal-btn .pp-logo .pp-pal { color: #009cde; }

  .micro-foot { margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 18px; font-size: 12px; color: var(--muted); }
  .micro-foot .item { display: inline-flex; align-items: center; gap: 6px; }
  .micro-foot svg { width: 13px; height: 13px; }

  @media (max-width: 980px) {
    .hero { grid-template-columns: 1fr; gap: 32px; padding: 28px 18px 48px; }
    .hero-card { padding: 30px 22px 24px; margin-top: 8px; }
  }

  /* Trust bar */
  .trust { background: var(--paper); border-top: 1px solid rgba(14,39,70,0.06); border-bottom: 1px solid rgba(14,39,70,0.06); padding: 30px 28px; }
  .trust-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-around; gap: 48px; flex-wrap: wrap; }
  .trust-item { display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .trust-item .num { font-family: 'Libre Baskerville', serif; font-weight: 600; color: var(--navy); font-size: 32px; line-height: 1; letter-spacing: -0.01em; }
  .trust-item .lab { color: var(--muted); font-size: 12px; line-height: 1.3; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; }
  @media (max-width: 640px) {

    .trust-item { flex: 1 1 0; }
    .trust-item .num { font-size: 22px; }
    .trust-item .lab { font-size: 10px; letter-spacing: 0.06em; }

  /* Generic section heading */
  .section { padding: 96px 28px; }
  .section-inner { max-width: 880px; margin: 0 auto; }
  .section-head { max-width: 760px; margin: 0 auto 48px; text-align: center; }
  .section-head .eyebrow { display: inline-flex; gap: 12px; justify-content: center; margin-bottom: 18px; }
  .section-head .eyebrow::before { display: none; }
  .section-head .eyebrow::after { content: ''; width: 28px; height: 2px; background: var(--coral); display: inline-block; }
  .section-head h2 { font-family: 'Libre Baskerville', serif; font-size: clamp(32px, 4.2vw, 50px); color: var(--navy); line-height: 1.08; letter-spacing: -0.01em; margin: 0 0 18px; font-weight: 700; }
  .section-head h2 em { color: var(--coral); font-style: italic; font-weight: 500; }
  .section-head p { font-size: 17px; line-height: 1.6; color: #333333; margin: 0; }

  /* Tired of starting over */
  .story { background: var(--paper); border-top: 1px solid rgba(14,39,70,0.06); border-bottom: 1px solid rgba(14,39,70,0.06); }
  .story p { font-size: 17px; line-height: 1.7; color: #333; margin: 0 0 16px; }
  .story .lead-in { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 19px; color: var(--navy); margin-bottom: 26px; line-height: 1.55; }
  .story-list { list-style: none; padding: 0; margin: 0 0 26px; display: grid; gap: 10px; max-width: 640px; }
  .story-list li { font-family: 'Libre Baskerville', serif; font-size: 16.5px; color: var(--navy); line-height: 1.45; padding-left: 28px; position: relative; }
  .story-list li::before { content: '–'; position: absolute; left: 8px; top: 0; color: var(--coral); font-weight: 700; }
  .story-cycle { background: var(--cream-2); border-radius: 14px; border-left: 4px solid var(--coral); padding: 26px 32px; margin: 28px 0; }
  .story-cycle p { font-family: 'Libre Baskerville', serif; font-style: italic; color: var(--navy); font-size: 18px; line-height: 1.55; margin: 0 0 12px; }
  .story-cycle p:last-child { margin-bottom: 0; font-style: normal; font-weight: 700; color: var(--coral); font-size: 19px; }
  .story-callout { margin-top: 28px; padding: 24px 28px; background: var(--navy); color: #f4ebdc; border-radius: 14px; }
  .story-callout strong { color: var(--coral-soft); display: block; font-family: 'Libre Baskerville', serif; font-size: 19px; margin-bottom: 6px; }
  .story-callout p { color: rgba(244,235,220,0.92); margin: 0; line-height: 1.55; }

  /* Real reason - dark navy section */
  .reason { background: var(--navy); color: #f4ebdc; padding: 96px 28px; border-top: 1px solid rgba(14,39,70,0.06); }
  .reason-inner { max-width: 920px; margin: 0 auto; }
  .reason .section-head h2 { color: #fff; }
  .reason .section-head h2 em { color: var(--coral-soft); }
  .reason .section-head .eyebrow { color: var(--coral-soft); }
  .reason .section-head .eyebrow::after { background: var(--coral-soft); }
  .reason .section-head p { color: rgba(244,235,220,0.8); }
  .reason p { font-size: 17px; line-height: 1.7; color: rgba(244,235,220,0.92); margin: 0 0 16px; }
  .reason p strong { color: #fff; }
  .reason .pillar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin: 32px 0 28px; }
  .reason .pillar { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 22px 20px; text-align: center; font-family: 'Libre Baskerville', serif; color: #fff; font-size: 17px; font-weight: 600; }
  .reason .pillar em { color: var(--coral-soft); font-style: italic; font-weight: 500; display: block; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  @media (max-width: 720px) { .reason .pillar-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 480px) { .reason .pillar-grid { grid-template-columns: 1fr; } }

  /* Two-up explainer (lifestyle / next phase) */
  .explainer { padding: 96px 28px; background: var(--cream); border-top: 1px solid rgba(14,39,70,0.06); }
  .explainer-inner { max-width: 880px; margin: 0 auto; }

  .explainer .pull { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 21px; line-height: 1.5; color: var(--navy); margin: 28px 0; padding: 22px 28px; background: var(--cream-2); border-left: 4px solid var(--coral); border-radius: 12px; }
  .explainer .pull strong { color: var(--coral); font-style: normal; font-weight: 700; }

  /* Inside the challenge - 3 col grid like /free-reset .feat */

  .challenge-grid { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .challenge-card { background: var(--cream); border: 1px solid rgba(14,39,70,0.06); border-radius: 16px; padding: 32px 28px; display: flex; flex-direction: column; gap: 14px; position: relative; transition: transform .2s, box-shadow .2s; }
  .challenge-card:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -24px rgba(14,39,70,.2); }

  .app { padding: 96px 28px; background: var(--navy); color: #f4ebdc; border-top: 1px solid rgba(14,39,70,0.1); }

function Results() {
  const tiles = [
    { name: 'Vicky, 56',  img: '/assets/vicky-before-after.png' },
    { name: 'Jill, 52',   img: '/assets/jill-before-after.jpg' },
    { name: 'Ruth, 54',   img: '/assets/ruth-before-after.jpg' },
    { name: 'Barbara, 58',img: '/assets/barbara-before-after.png' },
    { name: 'Member 5',   img: '/assets/member-05-before-after.png' },
    { name: 'Member 6',   img: '/assets/member-06-before-after.png' },
    { name: 'Member 7',   img: '/assets/member-07-before-after.png' },
    { name: 'Member 8',   img: '/assets/member-08-before-after.jpeg' },
    { name: 'Member 9',   img: '/assets/member-09-before-after.png' },
    { name: 'Member 10',  img: '/assets/member-10-before-after.png' },
    { name: 'Member 11',  img: '/assets/member-11-before-after.png' },
    { name: 'Member 12',  img: '/assets/member-12-before-after.png' },
  ];
  const trackRef = useRef(null);
  const [page, setPage] = useState(0);
  const [pageCount, setPageCount] = useState(1);

  const recompute = useCallback(() => {
    const track = trackRef.current; if (!track) return;
    const tile = track.querySelector('.results-tile'); if (!tile) return;
    const tileWidth = tile.offsetWidth + 16;
    const visible = Math.max(1, Math.round(track.clientWidth / tileWidth));
    const count = Math.max(1, tiles.length - visible + 1);
    setPageCount(count);
    setPage(Math.min(Math.round(track.scrollLeft / tileWidth), count - 1));
  }, [tiles.length]);

  useEffect(() => {
    recompute();
    const track = trackRef.current; if (!track) return;
    let frame;
    const onScroll = () => {
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        const tile = track.querySelector('.results-tile'); if (!tile) return;
        const tileWidth = tile.offsetWidth + 16;
        setPage(Math.round(track.scrollLeft / tileWidth));
      });
    };
    track.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', recompute);
    return () => {
      track.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', recompute);
      cancelAnimationFrame(frame);
    };
  }, [recompute]);

  const goTo = (idx) => {
    const track = trackRef.current; if (!track) return;
    const tile = track.querySelector('.results-tile'); if (!tile) return;
    track.scrollTo({ left: idx * (tile.offsetWidth + 16), behavior: 'smooth' });
  };
  const scrollBy = (dir) => goTo(Math.min(Math.max(page + dir, 0), pageCount - 1));

  return (
    <section className="results" id="results">
      <div className="section-head">
        <span className="eyebrow">Real women · Real results · Results that last</span>
        <h2 className="serif">See why so many women <em>live by the WLA.</em></h2>
      </div>
      <div className="results-carousel">
        <button className="results-nav prev" onClick={() => scrollBy(-1)} disabled={page === 0} aria-label="Previous results">‹</button>
        <div className="results-track" ref={trackRef}>
          {tiles.map((t, i) => (
            <div className="results-tile" key={i}>
              <img src={t.img} alt={`Before and after of ${t.name}`} loading="lazy" decoding="async" />
            </div>
          ))}
        </div>
        <button className="results-nav next" onClick={() => scrollBy(1)} disabled={page >= pageCount - 1} aria-label="Next results">›</button>
        <div className="results-dots" role="tablist">
          {Array.from({ length: pageCount }).map((_, i) => (
            <button key={i} className={'results-dot' + (i === page ? ' active' : '')} onClick={() => goTo(i)} aria-label={'Go to page ' + (i + 1)} />
          ))}
        </div>
      </div>
      <p className="results-disclaimer">*Results vary depending on the individual. There is no guarantee of specific results.</p>
    </section>
  );
}
