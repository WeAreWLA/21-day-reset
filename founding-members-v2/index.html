<style id="page-styles">
  :root {
    --navy: #0e2746; --navy-deep: #091a30;
    --coral: #d97757; --coral-soft: #e5917a;

    --paypal: #ffc439; --paypal-hover: #f0b62a;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Alegreya Sans", sans-serif; color: #333333; background: var(--cream); -webkit-font-smoothing: antialiased; }

  /* Announcement bar */
  @keyframes banner-shimmer {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }

  @keyframes dot-pulse {
    0%, 100% { transform: scale(1);    box-shadow: 0 0 0 0   rgba(245, 217, 206, 0.7); }
    50%      { transform: scale(1.25); box-shadow: 0 0 0 8px rgba(245, 217, 206, 0); }

  .announcement-bar {

    color: #f4ebdc; text-align: center;
    padding: 12px 24px;
    font-family: "Libre Baskerville", serif;
    font-size: 14px; letter-spacing: 0.02em;

  .announcement-bar .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;

  .announcement-bar strong { font-weight: 700; }
  @media (max-width: 640px) { .announcement-bar { font-size: 12px; padding: 9px 14px; } }

  /* Nav */
  .nav { position: sticky; top: 0; z-index: 40; background: var(--cream); border-bottom: 1px solid rgba(14,39,70,0.06); }
  .nav-inner { max-width: 1240px; margin: 0 auto; padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; gap: 32px; }

  .brand-by { font-style: italic; color: var(--coral); font-size: 15px; font-weight: 500; }

  .hero-cta-row { margin-top: 18px; max-width: 480px; }

  @media (max-width: 980px) { .hero { padding: 16px 18px 40px; gap: 24px; } .hero-image { max-width: 480px; margin: 0 auto; } .hero-cta-row { max-width: 100%; } }
  .eyebrow { display: inline-flex; align-items: center; gap: 12px; color: var(--coral); font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; margin-bottom: 24px; }

  /* Hero offer card */
  .hero-card { background: var(--paper); border: 1px solid rgba(14,39,70,0.08); border-radius: 20px; padding: 36px 32px 30px; box-shadow: 0 30px 60px -30px rgba(14,39,70,0.25), 0 8px 20px -10px rgba(14,39,70,0.10); position: relative; }

  .cta-btn { width: 100%; background: var(--navy); color: #fff; padding: 18px 22px; border-radius: 12px; border: none; font-weight: 700; font-size: 16px; letter-spacing: 0.01em; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: background .15s, transform .15s; text-decoration: none; line-height: 1.2; text-align: center; }

  @media (max-width: 640px) { .relate-list { grid-template-columns: 1fr; gap: 10px; } .relate-list li { padding: 14px 18px; font-size: 15px; } .relate-list li.span-2 { grid-column: auto; } }

  /* WLA Approach image (How It Works) */
  .wla-approach-image { margin: 28px auto 28px; max-width: 420px; }
  .wla-approach-image img { width: 100%; height: auto; display: block; mix-blend-mode: multiply; }

  /* Venn diagram (How It Works) — legacy, no longer used */
  .venn { position: relative; width: min(380px, 92vw); aspect-ratio: 1 / 1; margin: 36px auto 40px; }
  .venn-circle { position: absolute; width: 65%; aspect-ratio: 1 / 1; border-radius: 50%; display: grid; place-items: center; text-align: center; padding: 16px; font-family: 'Libre Baskerville', serif; font-style: italic; font-weight: 700; font-size: clamp(12px, 1.4vw, 15px); line-height: 1.2; box-sizing: border-box; }
  .venn-circle span { display: block; }
  .venn-circle.navy { top: 0; left: 50%; transform: translateX(-50%); background: var(--navy); color: #fff; z-index: 3; align-items: start; padding-top: 32px; }
  .venn-circle.coral { bottom: 0; left: 0; background: var(--coral); color: #fff; z-index: 2; align-items: end; padding-bottom: 32px; padding-left: 16px; }
  .venn-circle.cream { bottom: 0; right: 0; background: var(--cream-2); color: var(--navy); z-index: 1; align-items: end; padding-bottom: 32px; padding-right: 16px; }
  .venn-happy { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-family: 'Libre Baskerville', serif; font-style: italic; font-weight: 700; font-size: clamp(15px, 1.8vw, 20px); color: #fff; text-align: center; line-height: 1.05; z-index: 4; pointer-events: none; }
  .venn-happy em { font-style: italic; font-weight: 700; display: block; }

  /* Approach grid (How It Works) */
  .approach-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 24px; }
  .approach-card { background: var(--paper); border: 1px solid rgba(14,39,70,0.08); border-radius: 14px; padding: 24px 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 14px 28px -22px rgba(14,39,70,0.18); }
  .approach-icon { width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; font-weight: 700; font-family: 'Libre Baskerville', serif; }
  .approach-icon.cream-bg { background: var(--cream-2); color: var(--navy); }
  .approach-icon.coral-bg { background: var(--coral); color: #fff; }
  .approach-icon.navy-bg { background: var(--navy); color: #fff; }
  .approach-card h3 { font-family: 'Libre Baskerville', serif; font-size: 18px; color: var(--navy); margin: 0; font-weight: 700; line-height: 1.25; min-height: 2.5em; display: flex; align-items: flex-start; }

  @media (max-width: 880px) {
    .approach-grid { grid-template-columns: 1fr; gap: 14px; }

    .approach-card .approach-icon { grid-row: 1; grid-column: 1; }

  }

  /* Achievement blocks (Here's What You Can Achieve) */
  .achieve-block { margin-bottom: 32px; max-width: 920px; margin-inline: auto; }

  .achieve-check { flex: none; width: 28px; height: 28px; border-radius: 50%; background: rgba(217,119,87,0.18); color: var(--coral); display: grid; place-items: center; margin-top: 1px; }
  .achieve-check svg { width: 14px; height: 14px; stroke: var(--coral); stroke-width: 2.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  @media (max-width: 640px) { .achieve-list { grid-template-columns: 1fr; } }

  /* Why Now boxes */

  .why-now-box { background: var(--paper); border: 1px solid rgba(14,39,70,0.08); border-top: 4px solid var(--coral); border-radius: 12px; padding: 18px 16px; text-align: center; box-shadow: 0 14px 28px -22px rgba(14,39,70,0.2); }

  @media (max-width: 880px) { .why-now-boxes { grid-template-columns: repeat(2, 1fr); } }

  /* Meet Anna section — image floats left, text wraps around */

  .meet-anna-credentials .cred-name { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 14px; color: var(--coral); font-weight: 700; margin-bottom: 2px; line-height: 1.2; }

  /* Limited spots callout (above FinalCTA) */

  .limited-spots-pill { display: inline-block; padding: 7px 18px; background: var(--coral); color: #fff; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; border-radius: 999px; margin-bottom: 14px; }

  /* Year block (this isn't just 12 weeks) inside What's Included */

  .year-block-head { text-align: center; margin-bottom: 22px; }
  .year-block-head h3 { font-family: 'Libre Baskerville', serif; font-size: clamp(22px, 2.6vw, 30px); color: var(--navy); margin: 0 0 8px; font-weight: 700; line-height: 1.2; }
  .year-block-head p { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 18px; color: var(--coral); margin: 0; line-height: 1.4; }

  .year-list li { display: grid; grid-template-columns: 28px 1fr; gap: 12px; align-items: start; padding: 14px 18px; background: var(--paper); border-radius: 12px; border: 1px solid rgba(14,39,70,0.06); font-size: 15.5px; line-height: 1.45; color: #333; }

  .story-cycle { background: var(--cream-2); border-radius: 14px; border-left: 4px solid var(--coral); padding: 26px 32px; margin: 28px 0; }

  .story-callout p { color: #fff; margin: 0; line-height: 1.55; }

  /* Real reason - dark navy section */

  /* Special Opportunity card */

function Results() {
  const tiles = [
    { name: 'Vicky, 56',  img: '/assets/vicky-before-after.png' },
    { name: 'Jill, 52',   img: '/assets/jill-before-after.jpg' },
    { name: 'Ruth, 54',   img: '/assets/ruth-before-after.jpg' },
    { name: 'Barbara, 58',img: '/assets/barbara-before-after.png' },
    { name: 'Member 5',   img: '/assets/member-05-before-after.png' },
    { name: 'Member 6',   img: '/assets/member-06-before-after.png' },
    { name: 'Member 7',   img: '/assets/member-07-before-after.png' },
    { name: 'Member 8',   img: '/assets/member-08-before-after.jpeg' },
    { name: 'Member 9',   img: '/assets/member-09-before-after.png' },
    { name: 'Member 10',  img: '/assets/member-10-before-after.png' },
    { name: 'Member 11',  img: '/assets/member-11-before-after.png' },
    { name: 'Member 12',  img: '/assets/member-12-before-after.png' },
  ];
  const trackRef = useRef(null);
  const [page, setPage] = useState(0);
  const [pageCount, setPageCount] = useState(1);

  const recompute = useCallback(() => {
    const track = trackRef.current; if (!track) return;
    const tile = track.querySelector('.results-tile'); if (!tile) return;
    const colWidth = tile.offsetWidth + 16;
    const visibleCols = Math.max(1, Math.round(track.clientWidth / colWidth));
    const totalCols = Math.ceil(tiles.length / 2);
    const count = Math.max(1, totalCols - visibleCols + 1);
    setPageCount(count);
    setPage(Math.min(Math.round(track.scrollLeft / colWidth), count - 1));
  }, [tiles.length]);

  useEffect(() => {
    recompute();
    const track = trackRef.current; if (!track) return;
    let frame;
    const onScroll = () => {
      cancelAnimationFrame(frame);
      frame = requestAnimationFrame(() => {
        const tile = track.querySelector('.results-tile'); if (!tile) return;
        const tileWidth = tile.offsetWidth + 16;
        setPage(Math.round(track.scrollLeft / tileWidth));
      });
    };
    track.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', recompute);
    return () => {
      track.removeEventListener('scroll', onScroll);
      window.removeEventListener('resize', recompute);
      cancelAnimationFrame(frame);
    };
  }, [recompute]);

  const goTo = (idx) => {
    const track = trackRef.current; if (!track) return;
    const tile = track.querySelector('.results-tile'); if (!tile) return;
    track.scrollTo({ left: idx * (tile.offsetWidth + 16), behavior: 'smooth' });
  };
  const scrollBy = (dir) => goTo(Math.min(Math.max(page + dir, 0), pageCount - 1));

  return (
    <section className="results" id="results" style={{ paddingBottom: 48 }}>
      <div className="section-head">
        <span className="eyebrow">Real women · Real results · Results that last</span>
        <h2 className="serif">See why so many women <em>live by the WLA.</em></h2>
      </div>
      <div className="results-carousel">
        <button className="results-nav prev" onClick={() => scrollBy(-1)} disabled={page === 0} aria-label="Previous results">‹</button>
        <div className="results-track" ref={trackRef}>
          {tiles.map((t, i) => (
            <div className="results-tile" key={i}>
              <img src={t.img} alt={`Before and after of ${t.name}`} loading="lazy" decoding="async" />
            </div>
          ))}
        </div>
        <button className="results-nav next" onClick={() => scrollBy(1)} disabled={page >= pageCount - 1} aria-label="Next results">›</button>
        <div className="results-dots" role="tablist">
          {Array.from({ length: pageCount }).map((_, i) => (
            <button key={i} className={'results-dot' + (i === page ? ' active' : '')} onClick={() => goTo(i)} aria-label={'Go to page ' + (i + 1)} />
          ))}
        </div>
      </div>
      <p className="results-disclaimer">*Results vary depending on the individual. There is no guarantee of specific results.</p>
    </section>
  );
}

function StickyCTA() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const onScroll = () => {
      setShow(window.scrollY > 900 && window.scrollY < document.body.scrollHeight - 1200);
    };
    window.addEventListener('scroll', onScroll, { passive: true });
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <div className={'sticky-cta' + (show ? ' show' : '')}>
      <div className="text">
        <strong>Summer Challenge · £97 · 1 Year Access</strong>
      </div>
      <div className="sticky-cta-buttons">

        </a>
      </div>
    </div>
  );
}
