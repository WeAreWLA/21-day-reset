<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>WLA App · last chance ad variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #003060; --navy-deep: #00203f;
    --coral: #E87F63; --coral-soft: #F79F83; --peach: #F5D9CE;
    --cream: #F9F7F4; --cream-2: #E9DFD3; --paper: #FDFBF8;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #2a2a2a; font-family: "Alegreya Sans", sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 48px; padding: 48px 24px; }

  .ad { position: relative; overflow: hidden; display: flex; flex-direction: column;
        box-shadow: 0 30px 80px rgba(0,0,0,.5); }
  .sq { width: 1080px; height: 1080px; }
  .pt { width: 1080px; height: 1350px; }
  .st { width: 1080px; height: 1920px; }

  .strip { background: var(--coral); color: #fff; text-align: center;
           font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
  h1 { margin: 0; font-family: 'Libre Baskerville', serif; font-weight: 700;
       line-height: 1.12; letter-spacing: -.01em; }
  h1 em { font-style: italic; font-weight: 400; color: var(--coral); }

  .offer { width: 100%; background: var(--peach); text-align: center;
           position: relative; z-index: 5; color: var(--navy); }
  .offer-line { font-family: 'Libre Baskerville', serif; line-height: 1.1; letter-spacing: -.01em; }
  .offer-line strong { font-weight: 700; }
  .offer-line .was { font-weight: 400; opacity: .6; }
  .offer-sub { font-weight: 700; color: var(--coral); letter-spacing: .02em; margin-top: 10px; }
  .foot { background: var(--navy); color: var(--paper); text-align: center;
          font-weight: 600; letter-spacing: .14em; text-transform: uppercase; }

  .phone { border-radius: 34px; overflow: hidden; background: #fff; flex: none;
           box-shadow: 0 40px 70px -26px rgba(0,0,0,.6); }
  .phone img { width: 100%; display: block; }

  /* ============ VARIANT 2 — one phone on navy ============ */
  .v2 { background: var(--navy); color: var(--paper); }
  .v2 .body { flex: 1; min-height: 0; display: flex; flex-direction: column;
              align-items: center; text-align: center; position: relative; }
  .v2 h1 { color: var(--paper); }
  .v2 h1 em { color: var(--coral-soft); }
  .v2 .phone { border: 10px solid #0b2f55; }
  .v2 .glow { position: absolute; left: 50%; top: 42%; width: 128%; aspect-ratio: 1;
              transform: translate(-50%,-50%);
              background: radial-gradient(circle, rgba(232,127,99,.30) 0%, rgba(232,127,99,0) 62%);
              pointer-events: none; z-index: 0; }
  .v2 .phone { position: relative; z-index: 2; }
  .v2 h1 { position: relative; z-index: 2; }

  .v2.sq .strip { padding: 22px; font-size: 26px; }
  .v2.sq .body  { padding: 44px 70px 0; }
  .v2.sq h1 { font-size: 46px; }
  .v2.sq .phone { width: 330px; margin-top: 36px; }
  .v2.sq .offer { padding: 30px 50px; }
  .v2.sq .offer-line { font-size: 62px; }
  .v2.sq .offer-sub { font-size: 30px; }
  .v2.sq .foot { padding: 20px; font-size: 21px; }

  .v2.pt .strip { padding: 26px; font-size: 28px; }
  .v2.pt .body  { padding: 56px 56px 0; }
  .v2.pt h1 { font-size: 47px; }
  .v2.pt .phone { width: 400px; margin-top: 52px; }
  .v2.pt .offer { padding: 40px 60px; }
  .v2.pt .offer-line { font-size: 72px; }
  .v2.pt .offer-sub { font-size: 34px; }
  .v2.pt .foot { padding: 24px; font-size: 23px; }

  .v2.st .strip { padding: 32px; font-size: 30px; }
  .v2.st .body  { padding: 110px 48px 0; }
  .v2.st h1 { font-size: 48px; }
  .v2.st .phone { width: 500px; margin-top: 76px; }
  .v2.st .offer { padding: 52px 56px; }
  .v2.st .offer-line { font-size: 86px; }
  .v2.st .offer-sub { font-size: 40px; }
  .v2.st .foot { padding: 32px; font-size: 26px; margin-bottom: 150px; }

  /* ============ VARIANT 3 — Anna and a phone ============ */
  .v3 { background: var(--cream); color: var(--navy); }
  .v3 .scene { flex: 1; min-height: 0; position: relative; display: flex; }
  .v3 .shot { flex: 1; min-width: 0; position: relative; overflow: hidden; }
  .v3 .shot img.anna { width: 100%; height: 100%; object-fit: cover;
                       object-position: 60% 18%; display: block; }
  .v3.st .shot img.anna { object-position: 32% 22%; }
  .v3 .panel { flex: 1; min-width: 0; display: flex; flex-direction: column;
               justify-content: center; text-align: left; background: var(--cream); }
  .v3 .phone { position: absolute; border: 9px solid var(--navy); z-index: 4; }
  .v3 .byline { font-family: 'Libre Baskerville', serif; font-style: italic;
                color: var(--coral); }

  .v3.sq .strip { padding: 22px; font-size: 26px; }
  .v3.sq .panel { padding: 0 56px 0 86px; }
  .v3.sq h1 { font-size: 44px; }
  .v3.sq .byline { font-size: 26px; margin-top: 22px; }
  .v3.sq .phone { width: 250px; left: 24%; bottom: -40px; }
  .v3.sq .offer { padding: 30px 50px; }
  .v3.sq .offer-line { font-size: 62px; }
  .v3.sq .offer-sub { font-size: 30px; }
  .v3.sq .foot { padding: 20px; font-size: 21px; }

  .v3.pt .strip { padding: 26px; font-size: 28px; }
  .v3.pt .panel { padding: 0 56px 0 80px; }
  .v3.pt h1 { font-size: 48px; }
  .v3.pt .byline { font-size: 28px; margin-top: 24px; }
  .v3.pt .phone { width: 290px; left: 22%; bottom: -50px; }
  .v3.pt .offer { padding: 40px 60px; }
  .v3.pt .offer-line { font-size: 72px; }
  .v3.pt .offer-sub { font-size: 34px; }
  .v3.pt .foot { padding: 24px; font-size: 23px; }

  /* the story is too tall to split side by side: stack photo over copy */
  .v3.st .scene { flex-direction: column; }
  .v3.st .shot { flex: 0 0 900px; }
  /* The phone hangs off the bottom of the photo, so the copy below it needs
     clearance or the headline ends up underneath the handset. */
  .v3.st .panel { flex: 1; text-align: center; align-items: center;
                  justify-content: center; padding: 120px 56px 40px; }
  .v3.st .strip { padding: 32px; font-size: 30px; }
  .v3.st h1 { font-size: 50px; }
  .v3.st .byline { font-size: 30px; margin-top: 24px; }
  .v3.st .phone { width: 290px; left: auto; right: 56px; top: 420px; }
  .v3.st .offer { padding: 52px 56px; }
  .v3.st .offer-line { font-size: 86px; }
  .v3.st .offer-sub { font-size: 40px; }
  .v3.st .foot { padding: 32px; font-size: 26px; margin-bottom: 150px; }
</style>
</head>
<body>
<!-- Variants on the last-chance ad. Same copy, different treatment, so the
     two can be tested against the fanned-phones original. -->
<script>
  const HEAD = 'Last Chance &middot; Founding Members Promo';
  const H1 = 'Join WLA&rsquo;s new app as a Founding Member<br /><em>&amp; get 8 Week Fat Loss Challenge FREE</em>';
  const OFFER = '<div class="offer">' +
    '<div class="offer-line">Only <strong>£97</strong> <span class="was">(instead of £297)</span></div>' +
    '<div class="offer-sub">Limited places left!</div></div>' +
    '<div class="foot">Weight Loss &amp; Lifestyle Academy</div>';

  function v2(size) {
    return `<div class="ad v2 ${size}" id="v2-${size}">
      <div class="strip">${HEAD}</div>
      <div class="body">
        <div class="glow"></div>
        <h1>${H1}</h1>
        <div class="phone"><img src="/assets/app-home-tracker.jpg" alt="" /></div>
      </div>${OFFER}</div>`;
  }
  function v3(size) {
    return `<div class="ad v3 ${size}" id="v3-${size}">
      <div class="strip">${HEAD}</div>
      <div class="scene">
        <div class="shot"><img class="anna" src="/assets/anna-portrait.jpg" alt="" /></div>
        <div class="panel"><h1>${H1}</h1>
          <div class="byline">Anna Wallace &middot; Registered Associate Nutritionist</div></div>
        <div class="phone"><img src="/assets/app-home-tracker.jpg" alt="" /></div>
      </div>${OFFER}</div>`;
  }
  document.write(['sq','pt','st'].map(v2).join('') + ['sq','pt','st'].map(v3).join(''));
</script>
</body>
</html>
