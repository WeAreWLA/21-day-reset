<style id="page-styles">
  :root {
    --navy: #0e2746; --navy-deep: #091a30;
    --coral: #d97757; --coral-soft: #e5917a; --coral-salmon: #F79F83;
    --cream: #F9F7F4; --cream-2: #E9DFD3;
    --paper: #FDFBF8; --ink: #1a2438;
    --muted: #5a6478; --rule: #d9cdb6; --ok: #2e7d5b;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { font-family: "Alegreya Sans", sans-serif; color: #333333; background: var(--cream); -webkit-font-smoothing: antialiased; }
  .serif { font-family: 'Libre Baskerville', serif; font-optical-sizing: auto; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; cursor: pointer; }
  img { max-width: 100%; display: block; }

  .urgency-banner { position: relative; overflow: hidden; background: var(--coral-salmon); color: #003060; text-align: center; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; padding: 12px 18px; display: flex; align-items: center; justify-content: center; gap: 14px; box-shadow: inset 0 -1px 0 rgba(14,39,70,0.12); }
  .urgency-banner::before { content: ''; position: absolute; top: 0; left: -40%; width: 40%; height: 100%; background: linear-gradient(110deg, transparent 0%, rgba(255,255,255,0.45) 50%, transparent 100%); transform: skewX(-18deg); animation: urgSheen 4.8s ease-in-out infinite; pointer-events: none; }
  @keyframes urgSheen { 0% { left: -40%; } 60% { left: 120%; } 100% { left: 120%; } }
  .urgency-banner > * { position: relative; z-index: 1; }
  .urgency-banner .urg-flag { display: inline-flex; align-items: center; background: rgba(0,0,0,0.22); color: #fff; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.18em; padding: 5px 11px; border-radius: 999px; flex: none; }
  .urgency-banner .urg-pulse { width: 7px; height: 7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 0 rgba(255,255,255,0.85); animation: urgPulse 1.6s infinite; flex: none; }
  @keyframes urgPulse { 0% { box-shadow: 0 0 0 0 rgba(255,255,255,0.85);} 70% { box-shadow: 0 0 0 8px rgba(255,255,255,0);} 100% { box-shadow: 0 0 0 0 rgba(255,255,255,0);} }
  .urgency-banner strong { font-weight: 800; text-transform: uppercase; letter-spacing: 0.1em; }
  @media (max-width: 640px) { .urgency-banner { font-size: 13px; padding: 10px 12px; gap: 10px; flex-wrap: wrap; } .urgency-banner .urg-flag { font-size: 10px; padding: 4px 9px; } }

  .hero { max-width: 1180px; margin: 0 auto; padding: 24px 28px 56px; display: grid; grid-template-columns: 0.85fr 1fr; gap: 40px; align-items: stretch; }
  .hero-image-wrap { position: relative; overflow: visible; min-height: 520px; }
  .hero-image-wrap .bg { position: absolute; inset: 0; }
  .hero-image-wrap .anna { position: absolute; inset: 0; background-image: url('/assets/anna-before-after.png'); background-size: contain; background-repeat: no-repeat; background-position: center top; }
  .hero-image-wrap .phone { position: absolute; background: #0e2746; border-radius: 28px; padding: 9px; box-shadow: 0 24px 48px -12px rgba(14,39,70,0.45), 0 0 0 1px rgba(255,255,255,0.06) inset; z-index: 2; will-change: transform; backface-visibility: hidden; -webkit-backface-visibility: hidden; transform-style: preserve-3d; }
  .hero-image-wrap .phone::before { content: ''; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); width: 70px; height: 6px; background: #000; border-radius: 999px; z-index: 1; }
  .hero-image-wrap .phone img { display: block; border-radius: 20px; width: 100%; height: 100%; object-fit: cover; object-position: center top; transform: translateZ(0); backface-visibility: hidden; -webkit-backface-visibility: hidden; image-rendering: auto; }
  .hero-image-wrap .phone.front { left: 50%; bottom: -6%; width: 26%; aspect-ratio: 9 / 18; transform: translateX(-50%) rotate(-4deg); }
  @media (max-width: 980px) {
    .hero-image-wrap { min-height: 460px; }
    .hero-image-wrap .phone.front { width: 32%; bottom: -30px; }
  }
  @media (max-width: 640px) {
    .hero-image-wrap { min-height: 420px; }
    .hero-image-wrap .phone.front { width: 36%; bottom: -28px; }
  }

  .form-card { border: 3px solid var(--navy); border-radius: 22px; background: var(--paper); padding: 30px 30px 26px; text-align: center; box-shadow: 0 30px 60px -30px rgba(14,39,70,0.25), 0 8px 20px -10px rgba(14,39,70,0.10); display: flex; flex-direction: column; }
  .form-card .pill { display: inline-flex; align-self: center; align-items: center; gap: 8px; padding: 6px 14px; background: rgba(46,125,91,0.10); color: var(--ok); font-size: 11px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; border-radius: 999px; margin-bottom: 14px; }
  .form-card .pill .pulse { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(46,125,91,.5); animation: pulseGreen 1.8s infinite; }
  @keyframes pulseGreen { 0% { box-shadow: 0 0 0 0 rgba(46,125,91,.5); } 70% { box-shadow: 0 0 0 8px rgba(46,125,91,0); } 100% { box-shadow: 0 0 0 0 rgba(46,125,91,0); } }
  .form-card .title { font-family: 'Libre Baskerville', serif; color: var(--navy); font-weight: 700; font-size: clamp(26px, 2.6vw, 34px); line-height: 1.15; margin: 0 0 14px; letter-spacing: -0.01em; }
  .form-card .title em { color: var(--coral); font-style: italic; font-weight: 500; }
  .form-card .offer { font-family: 'Libre Baskerville', serif; font-weight: 700; font-size: clamp(19px, 1.9vw, 23px); line-height: 1.3; margin: 0 0 16px; color: var(--navy); }
  .form-card .offer .coral { color: var(--coral-salmon); }
  .form-card .offer .navy { color: #003060; }
  .form-card .offer em { font-style: italic; }
  .form-card .body { font-family: "Alegreya Sans", sans-serif; font-size: clamp(16px, 1.4vw, 18px); line-height: 1.5; color: #333; margin: 0 0 20px; }
  .form-card .body strong { font-weight: 700; color: #333; }
  .form-card .body .underline { font-style: italic; text-decoration: underline; text-underline-offset: 3px; }
  .form-card form { margin: 0; }
  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; text-align: left; }
  .field label { position: absolute; left: -9999px; }
  .field input { appearance: none; border: 1.5px solid rgba(14,39,70,0.18); background: #fff; padding: 13px 15px; border-radius: 10px; font: 16px "Alegreya Sans", sans-serif; color: var(--ink); transition: border-color .15s, box-shadow .15s; }
  .field input:focus { outline: none; border-color: var(--coral); box-shadow: 0 0 0 3px rgba(217,119,87,0.18); }
  .field input.err { border-color: #c0392b; box-shadow: 0 0 0 3px rgba(192,57,43,0.12); }
  .submit-btn { margin-top: 6px; width: 100%; background: var(--navy); color: #fff; padding: 15px 18px; border-radius: 12px; border: none; font-weight: 700; font-size: 17px; letter-spacing: 0.01em; display: inline-flex; align-items: center; justify-content: center; gap: 10px; transition: background .15s, transform .15s; }
  .submit-btn:hover { background: var(--navy-deep); transform: translateY(-1px); }
  .submit-btn .arrow { transition: transform .2s; }
  .submit-btn:hover .arrow { transform: translateX(3px); }
  .submit-btn:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
  .form-foot { font-family: 'Libre Baskerville', serif; font-style: italic; font-size: 16px; line-height: 1.5; color: var(--muted); margin: 18px 0 0; }

  .success { text-align: center; padding: 14px 4px; }
  .success .check { width: 64px; height: 64px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; margin: 0 auto 18px; box-shadow: 0 16px 30px -14px rgba(46,125,91,0.5); }
  .success .check svg { width: 32px; height: 32px; stroke: #fff; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .success h2 { font-family: 'Libre Baskerville', serif; color: var(--navy); font-size: clamp(22px, 2.4vw, 28px); margin: 0 0 10px; font-weight: 700; }
  .success h2 em { color: var(--coral); font-style: italic; font-weight: 500; }
  .success p { font-size: 16px; line-height: 1.55; color: #333; margin: 0 0 8px; }
  .success p strong { color: var(--navy); }

  .foot { padding: 32px 28px; background: var(--cream); border-top: 1px solid rgba(14,39,70,0.08); color: var(--muted); font-size: 13px; }
  .foot-inner { max-width: 1240px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .foot a:hover { color: var(--coral); }

  @media (max-width: 980px) {
    .hero { grid-template-columns: 1fr; padding: 16px 18px 40px; gap: 20px; }
    .hero-image-wrap { order: 2; min-height: 320px; max-height: 440px; }
    .form-wrap { order: 1; }
    .form-card { padding: 24px 22px 22px; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const Arrow = ({ className = 'arrow' }) => (
  <svg className={className} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
    <line x1="5" y1="12" x2="19" y2="12" /><polyline points="13 6 19 12 13 18" />
  </svg>
);

function UrgencyBanner() {
  return (
    <div className="urgency-banner" role="alert">
      <span className="urg-flag"><span className="urg-pulse" aria-hidden="true"></span>&nbsp;Limited</span>
      <span><strong>Only 100 places available</strong></span>
    </div>
  );
}

function Hero() {
  const [vals, setVals] = useState({ first: '', email: '' });
  const [utm, setUtm] = useState({ utm_source: '', utm_medium: '', utm_campaign: '', utm_content: '' });
  const [errs, setErrs] = useState({});
  const [loading, setLoading] = useState(false);
  const [done, setDone] = useState(false);

  useEffect(() => {
    const params = new URLSearchParams(window.location.search);
    setUtm({
      utm_source: params.get('utm_source') || '',
      utm_medium: params.get('utm_medium') || '',
      utm_campaign: params.get('utm_campaign') || '',
      utm_content: params.get('utm_content') || '',
    });
  }, []);

  const onChange = (k) => (e) => {
    setVals(v => ({ ...v, [k]: e.target.value }));
    setErrs(er => ({ ...er, [k]: undefined }));
  };
  const onSubmit = (e) => {
    e.preventDefault();
    const er = {};
    if (!vals.first.trim()) er.first = true;
    if (!/^\S+@\S+\.\S+$/.test(vals.email)) er.email = true;
    if (Object.keys(er).length) { setErrs(er); return; }
    setLoading(true);
    const fd = new FormData();
    fd.append('fields[name]', vals.first);
    fd.append('fields[email]', vals.email);
    if (utm.utm_source)   fd.append('fields[utm_source]',   utm.utm_source);
    if (utm.utm_medium)   fd.append('fields[utm_medium]',   utm.utm_medium);
    if (utm.utm_campaign) fd.append('fields[utm_campaign]', utm.utm_campaign);
    if (utm.utm_content)  fd.append('fields[utm_content]',  utm.utm_content);
    fd.append('ml-submit', '1');
    fd.append('anticsrf', 'true');
    fetch('https://assets.mailerlite.com/jsonp/1287540/forms/190062981624629244/subscribe', {
      method: 'POST', body: fd, mode: 'no-cors',
    }).finally(() => {
      if (window.fbq) window.fbq('track', 'Lead', { content_name: 'WLA App Waitlist', content_category: 'optin' });
      if (window.gtag) window.gtag('event', 'generate_lead', { freebie: 'wla_app_waitlist' });
      const qs = new URLSearchParams();
      if (utm.utm_source)   qs.set('utm_source',   utm.utm_source);
      if (utm.utm_medium)   qs.set('utm_medium',   utm.utm_medium);
      if (utm.utm_campaign) qs.set('utm_campaign', utm.utm_campaign);
      if (utm.utm_content)  qs.set('utm_content',  utm.utm_content);
      const tail = qs.toString();
      window.location.href = '/app-waitlist/ty/' + (tail ? '?' + tail : '');
    });
  };

  return (
    <section className="hero" id="optin">
      <div className="hero-image-wrap">
        <div className="bg">
          <div className="anna" role="img" aria-label="Anna Wallace before and after"></div>
        </div>
        <div className="phone front"><img src="/assets/app-screenshots/iphone/1242x2688/nutrition-recipes.jpg" alt="WLA App · recipes" /></div>
      </div>

      <div className="form-wrap">
        <div className="form-card">
          {!done ? (
            <>
              <h1 className="title">100 Women Wanted<br/>To Test New<br/><em>Nutrition &amp; Weight Loss</em><br/>App</h1>
              <div className="offer">
                <span className="navy" style={{ fontSize: '17px', fontWeight: 600, fontFamily: '"Libre Baskerville", serif', fontStyle: 'italic', display: 'block', marginBottom: 10 }}>designed by a degree qualified Nutritionist</span>
                <span className="navy" style={{ fontSize: '18px', lineHeight: 1.45, fontFamily: '"Alegreya Sans", sans-serif', fontWeight: 500, display: 'block' }}>We are rebranding and launching a new nutrition and weight loss app and we need testers.</span>
              </div>
              <p className="body">
                <strong>Requirement</strong> - have a weight loss goal of around <strong>2 stone</strong>.
              </p>
              <form onSubmit={onSubmit} noValidate>
                <input type="hidden" name="fields[utm_source]"   value={utm.utm_source}   readOnly />
                <input type="hidden" name="fields[utm_medium]"   value={utm.utm_medium}   readOnly />
                <input type="hidden" name="fields[utm_campaign]" value={utm.utm_campaign} readOnly />
                <input type="hidden" name="fields[utm_content]"  value={utm.utm_content}  readOnly />
                <div className="field">
                  <label>First Name</label>
                  <input className={errs.first ? 'err' : ''} placeholder="Your first name" value={vals.first} onChange={onChange('first')} />
                </div>
                <div className="field">
                  <label>Email Address</label>
                  <input type="email" className={errs.email ? 'err' : ''} placeholder="you@example.com" value={vals.email} onChange={onChange('email')} />
                </div>
                <button className="submit-btn" type="submit" disabled={loading}>
                  {loading ? 'Sending…' : <>Apply To Become A Tester <Arrow /></>}
                </button>
              </form>
              <p className="form-foot">Once registered, check emails for confirmation.</p>
            </>
          ) : (
            <div className="success">
              <div className="check">
                <svg viewBox="0 0 24 24"><polyline points="4 12.5 10 18 20 6.5" /></svg>
              </div>
              <h2>You're on the <em>waitlist!</em></h2>
              <p>We'll be in touch with everything you need to know about the app and the rebrand.</p>
              <p>Keep an eye on your inbox (check spam &amp; promotions too) so you don't miss anything.</p>
            </div>
          )}
        </div>
      </div>
    </section>
  );
}

function Footer() {
  return (
    <footer className="foot">
      <div className="foot-inner">
        <div>© 2026 The Weight Loss &amp; Lifestyle Academy. All rights reserved.</div>
        <div style={{ display: 'flex', gap: 24 }}>
          <a href="https://www.wearewla.com/privacy-policy" target="_blank" rel="noopener">Privacy</a>
          <a href="https://www.wearewla.com/terms-of-service" target="_blank" rel="noopener">Terms</a>
          <a href="mailto:support@theweightloss-academy.com">Contact</a>
        </div>
      </div>
    </footer>
  );
}

function Page() {
  return (
    <>
      <UrgencyBanner />
      <Hero />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
</body>
