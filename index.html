<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The 21 Day Reset · Weight Loss Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    /* WLA brand palette */
    --bg: #F9F7F4;              /* Cream White */
    --cream-deep: #E9DFD3;      /* Warm Beige */
    --paper: #FDFBF8;           /* Near-white paper */
    --ink: #003060;             /* Deep Navy */
    --ink-muted: #5B6B82;       /* Navy-grey for supporting text */
    --body-ink: #333333;        /* Grey Black for paragraphs */
    --terracotta: #F79F83;      /* Soft Blush (accent) */
    --blush-deep: #E87F63;      /* Stronger blush for CTA contrast */
    --sage: #003060;            /* sage replaced by navy for ticks */
    --peach: #F5D9CE;           /* Lighter blush tint */
    --hairline: #D9CFC3;        /* Beige hairline */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--body-ink); font-family: "Alegreya Sans", sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  ::selection { background: var(--peach); }
  /* Tweaks panel */
  .tweaks-panel { position: fixed; bottom: 20px; right: 20px; background: var(--paper); border: 1px solid var(--hairline); border-radius: 14px; padding: 18px; font-family: "Alegreya Sans", sans-serif; font-size: 14px; width: 260px; box-shadow: 0 20px 40px -20px rgba(0,48,96,.2); z-index: 200; }
  .tweaks-panel h4 { margin: 0 0 12px; font-family: "Libre Baskerville", serif; font-size: 17px; font-weight: 700; color: var(--ink); }
  .tweaks-panel label { display: block; margin-bottom: 10px; color: var(--ink-muted); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; }
  .tweaks-panel input[type=color] { width: 100%; height: 32px; border: 1px solid var(--hairline); border-radius: 6px; padding: 2px; background: white; cursor: pointer; }
  .tweaks-panel select, .tweaks-panel input[type=text] { width: 100%; padding: 8px 10px; border: 1px solid var(--hairline); border-radius: 6px; font-family: inherit; font-size: 13px; background: white; }

  /* ---------- Responsive ---------- */
  /* Tablet and below */
  @media (max-width: 960px) {
    /* Collapse all multi-col grids to single column, any depth */
    section [style*="grid-template-columns"],
    section[style*="grid-template-columns"] {
      grid-template-columns: 1fr !important;
      gap: 32px !important;
    }
    /* Reduce outer section padding */
    section { padding-left: 20px !important; padding-right: 20px !important; }
    /* Shrink huge display text */
    h1, h2 { font-size: clamp(34px, 7vw, 56px) !important; line-height: 1.15 !important; }
    /* Hide nav links (keep just the logo + CTA) */
    nav > div:last-child a:not([href*="sales.thewlacademy"]) { display: none !important; }
    /* Announcement bar smaller */
    body > div:first-child { font-size: 12px !important; padding: 8px 16px !important; }
    /* Hero image block: reset absolute floating chips so they don't overflow viewport */
    section > div > div[style*="position: relative"] > div[style*="position: absolute"] {
      position: relative !important;
      inset: auto !important;
      top: auto !important; left: auto !important; right: auto !important; bottom: auto !important;
      transform: none !important;
      margin-top: 16px !important;
      max-width: 100% !important;
    }
    /* Big numbers in SHIFT method: shrink */
    section#method div[style*="font-size: 92"] { font-size: 56px !important; }
    /* Stat pills wrap */
    section > div > div[style*="border-top"][style*="gap: 48"] { flex-wrap: wrap !important; gap: 24px !important; }
    /* Pricing card padding */
    section#join > div > div[style*="border-radius: 24"] { padding: 32px 20px !important; }
    section#join div[style*="font-size: 100"] { font-size: 72px !important; }
    /* FAQ sticky column becomes static */
    section#faq div[style*="position: sticky"] { position: static !important; }
    /* Sticky CTA full width text sizing */
    /* Before/after grid: 2-col on tablet */
    section section, section {}
    /* Override to 2 columns for before/after photo grid on tablet via wider rule */
  }
  @media (max-width: 960px) and (min-width: 641px) {
    /* Keep photo grid 2-col on tablet */
    section [style*="grid-template-columns: repeat(4"] {
      grid-template-columns: repeat(2, 1fr) !important;
    }
  }
  @media (max-width: 640px) {
    /* Collapse 4-col grids etc already handled. Further shrinks. */
    section { padding-top: 72px !important; padding-bottom: 72px !important; }
    h1, h2 { font-size: clamp(30px, 8vw, 44px) !important; }
    /* Smaller testimonial / included cards padding */
    section > div > div[style*="border-radius"][style*="padding: 32"] { padding: 22px !important; }
    /* Tweaks panel shrinks */
    .tweaks-panel { width: calc(100vw - 40px) !important; right: 20px !important; }
  }
</style>
</head>
<body>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components/sections.jsx"></script>
<script type="text/babel" src="components/hero.jsx"></script>
<script type="text/babel" src="components/method.jsx"></script>
<script type="text/babel" src="components/content.jsx"></script>
<script type="text/babel" src="components/closing.jsx"></script>

<script type="text/babel">

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "headlineVariant": "nothing-works",
  "showStickyCTA": true,
  "ctaStyle": "navy"
} /*EDITMODE-END*/;

const HEADLINES = {
  "nothing-works": {
    eyebrow: "Designed for women 45+",
    title: <>The 21 Day Fat Loss Reset<br /><Italic>lose weight curb cravings boost energy</Italic></>,
    sub: "An evidence based, nutritionist-designed weight loss reset for women 45+ who feel like their body stopped responding. No 1,200-calorie plans. No cutting out carbs. No intense exercise."
  },
  "feel-like-me": {
    eyebrow: "For women 45+ in midlife",
    title: <>Feel like <Italic>you</Italic> again — in 21 days.</>,
    sub: "A sustainable, menopause-aware reset for women who've tried everything and are ready for a plan built around the body they actually have. No starvation, no Slimming World culture, no starting over."
  },
  "metabolism-broken": {
    eyebrow: "Midlife fat loss, done differently",
    title: <>Your metabolism isn't broken. <Italic>It just needs a different plan.</Italic></>,
    sub: "Built by a Registered Associate Nutritionist for women 45+ navigating menopause. Stable energy, steady fat loss, and no more starting over every Monday."
  }
};

function App() {
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);
  const [stickyVisible, setStickyVisible] = React.useState(false);

  // Apply CTA style
  React.useEffect(() => {
    if (tweaks.ctaStyle === 'blush') {
      document.documentElement.style.setProperty('--cta-bg', '#E87F63');
    } else {
      document.documentElement.style.setProperty('--cta-bg', '#003060');
    }
  }, [tweaks.ctaStyle]);

  // Sticky CTA visibility
  React.useEffect(() => {
    const onScroll = () => {
      setStickyVisible(window.scrollY > 800 && window.scrollY < document.body.scrollHeight - 1400);
    };
    window.addEventListener('scroll', onScroll);
    onScroll();
    return () => window.removeEventListener('scroll', onScroll);
  }, []);

  // Edit mode handshake
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const updateTweak = (key, value) => {
    const next = { ...tweaks, [key]: value };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: value } }, '*');
  };

  // Override Hero per tweak
  const headline = HEADLINES[tweaks.headlineVariant] || HEADLINES['nothing-works'];

  return (
    <>
      <AnnouncementBar />
      <Nav />
      {/* Tweakable hero wrapper */}
      <TweakableHero headline={headline} />
      <ProblemSection />
      <MethodSection />
      <TransformSection />
      <IncludedSection />
      <TestimonialsSection />
      <AboutSection />
      <PricingSection />
      <VideoTestimonialsSection />
      <FAQSection />
      <FinalCTA />
      <Footer />
      {tweaks.showStickyCTA && <StickyCTA visible={stickyVisible} />}

      {tweaksOpen &&
      <div className="tweaks-panel">
          <h4>Tweaks</h4>
          <label>CTA button colour</label>
          <select value={tweaks.ctaStyle}
        onChange={(e) => updateTweak('ctaStyle', e.target.value)}
        style={{ marginBottom: 14 }}>
            <option value="navy">Deep Navy (primary)</option>
            <option value="blush">Soft Blush</option>
          </select>
          <label>Hero headline variant</label>
          <select value={tweaks.headlineVariant}
        onChange={(e) => updateTweak('headlineVariant', e.target.value)}
        style={{ marginBottom: 14 }}>
            <option value="nothing-works">"Started over more times than you can count"</option>
            <option value="feel-like-me">"Feel like you again"</option>
            <option value="metabolism-broken">"Your metabolism isn't broken"</option>
          </select>
          <label style={{ display: 'flex', alignItems: 'center', gap: 8, textTransform: 'none', letterSpacing: 0, fontSize: 13, color: 'var(--ink)' }}>
            <input type="checkbox" checked={tweaks.showStickyCTA}
          onChange={(e) => updateTweak('showStickyCTA', e.target.checked)} />
            Sticky price bar
          </label>
        </div>
      }
    </>);

}

function TweakableHero({ headline }) {
  return (
    <>
    <section style={{
      maxWidth: 1240,
      margin: '0 auto',
      padding: '40px 32px 80px',
      display: 'grid',
      gridTemplateColumns: '1.1fr 0.9fr',
      gap: 72,
      alignItems: 'center'
    }}>
      <div>
        <Eyebrow>{headline.eyebrow}</Eyebrow>
        <SerifH as="h1" size={76} style={{ marginTop: 22, marginBottom: 24 }}>
          {headline.title}
        </SerifH>
        <Body size={19} muted style={{ maxWidth: 560, marginBottom: 36 }}>
          {headline.sub}
        </Body>

        <div style={{ display: 'flex', alignItems: 'center', gap: 20, flexWrap: 'wrap', marginBottom: 44 }}>
          <PrimaryCTA>Secure your place for £17</PrimaryCTA>
          <div style={{ fontFamily: '"Alegreya Sans", sans-serif', fontSize: 13, color: 'var(--ink-muted)', lineHeight: 1.5 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
              <Tick /> 7-day money-back guarantee
            </div>
            <div style={{ marginTop: 4, opacity: 0.75 }}>Regular price £97 · Pre-week Mon 4 May</div>
          </div>
        </div>

        <div style={{
          display: 'flex', gap: 48, paddingTop: 28, borderTop: '1px solid var(--hairline)'
        }}>
          <div><div style={{ fontFamily: '"Libre Baskerville", serif', fontSize: 32, lineHeight: 1 }}>50,000+</div><div style={{ fontSize: 12, color: 'var(--ink-muted)', letterSpacing: '0.04em' }}>WOMEN SUPPORTED</div></div>
          <div><div style={{ fontFamily: '"Libre Baskerville", serif', fontSize: 32, lineHeight: 1 }}>10 yrs</div><div style={{ fontSize: 12, color: 'var(--ink-muted)', letterSpacing: '0.04em' }}>CLINICAL PRACTICE</div></div>
          <div><div style={{ fontFamily: '"Libre Baskerville", serif', fontSize: 32, lineHeight: 1 }}>4.9 ★</div><div style={{ fontSize: 12, color: 'var(--ink-muted)', letterSpacing: '0.04em' }}>MEMBER RATING</div></div>
        </div>
      </div>

      <div style={{ position: 'relative' }}>
        <div style={{
          aspectRatio: '4/5',
          borderRadius: 4,
          overflow: 'hidden',
          background: '#F9F7F4',
        }}>
          <img src="assets/anna-hero.jpg" alt="Anna Wareham" style={{
            width: '100%', height: '100%', objectFit: 'cover', display: 'block',
          }} />
        </div>

        <div style={{
          position: 'absolute', bottom: -28, left: -28,
          background: 'var(--paper)', padding: '18px 22px', borderRadius: 12,
          boxShadow: '0 20px 40px -18px rgba(80, 40, 20, 0.25)',
          border: '1px solid var(--hairline)', maxWidth: 260
        }}>
          <div style={{ fontFamily: '"Libre Baskerville", serif', fontStyle: 'italic', fontSize: 13, color: 'var(--terracotta)', marginBottom: 6 }}>Led by</div>
          <div style={{ fontFamily: '"Libre Baskerville", serif', fontSize: 22, color: 'var(--ink)', marginBottom: 2 }}>Anna Wallace</div>
          <div style={{ fontSize: 12, color: 'var(--ink-muted)', letterSpacing: '0.02em', lineHeight: 1.4 }}>
            BSc Food &amp; Nutrition<br />Registered Associate Nutritionist
          </div>
        </div>
        <div style={{
          position: 'absolute', top: 24, left: -24,
          background: 'var(--cream-deep)', padding: '14px 18px', borderRadius: 10,
          maxWidth: 220, border: '1px solid var(--hairline)', transform: 'rotate(-2deg)'
        }}>
          <div style={{ fontFamily: '"Libre Baskerville", serif', fontStyle: 'italic', fontSize: 14, color: 'var(--ink)', lineHeight: 1.4 }}>
            "My menopause symptoms improved and I lost 12 lbs."
          </div>
          <div style={{ fontSize: 11, color: 'var(--ink-muted)', marginTop: 6, letterSpacing: '0.06em' }}>— RUTH, 54</div>
        </div>
      </div>
    </section>

    <section style={{ maxWidth: 1240, margin: '0 auto', padding: '0 32px 64px' }}>
      <div style={{
        padding: '22px 28px',
        background: 'var(--peach)',
        borderRadius: 14,
        display: 'flex',
        alignItems: 'center',
        gap: 20,
        flexWrap: 'wrap',
      }}>
        <div style={{ fontSize: 26 }}>🎁</div>
        <div style={{ flex: 1, minWidth: 260 }}>
          <div style={{
            fontFamily: '"Libre Baskerville", serif',
            fontWeight: 700,
            fontSize: 20,
            color: 'var(--ink)',
          }}>Early-bird bonus: <Italic>3-Week Fat Loss Accelerator Meal Plan</Italic></div>
          <Body size={14} muted style={{ marginTop: 2 }}>First 100 women only · instant access on signup</Body>
        </div>
        <div style={{
          fontFamily: '"Alegreya Sans", sans-serif',
          fontSize: 12,
          letterSpacing: '0.1em',
          textTransform: 'uppercase',
          color: 'var(--blush-deep)',
          fontWeight: 600,
        }}>
          Included free
        </div>
      </div>
    </section>
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
